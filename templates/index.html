<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Catalog</title>

<style>
body{font-family:system-ui;margin:0;background:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;padding:12px}
.card{border:1px solid #eee;border-radius:14px;overflow:hidden}
.img{width:100%;height:280px;object-fit:cover}
.meta{padding:10px}
.brand{font-weight:800}
.price{font-weight:900}
.actions{display:flex;gap:6px;margin-top:8px}
.buy{flex:1;background:#111;color:#fff;border:none;padding:10px;border-radius:10px}
.wa{background:#25D366}
</style>
</head>

<body>

<div class="grid" id="grid"></div>

<script>

let tgUser="";
let waNumber="";

async function getTargets(){
 const r=await fetch("/api/buy_targets");
 const j=await r.json();
 tgUser=j.telegram||"";
 waNumber=j.whatsapp||"";
}

function buildTelegram(p){
 const text=encodeURIComponent("Хочу купить:\n"+(p.caption||""));
 return `https://t.me/${tgUser}?text=${text}`;
}

function buildWhatsApp(p){
 const text=encodeURIComponent("Хочу купить:\n"+(p.caption||""));
 return `https://wa.me/${waNumber}?text=${text}`;
}

function card(p){
 return `
<div class="card">
<img class="img" src="/img/${p.file_id}">
<div class="meta">
<div class="brand">${(p.brand||"").toUpperCase()}</div>
<div class="price">${p.price_raw||""}</div>
<div>${p.caption||""}</div>

<div class="actions">
<a href="${buildTelegram(p)}"><button class="buy">Telegram</button></a>
<a href="${buildWhatsApp(p)}"><button class="buy wa">WhatsApp</button></a>
</div>

</div>
</div>`;
}

async function load(){
 const r=await fetch("/api/products");
 const data=await r.json();
 const grid=document.getElementById("grid");
 data.forEach(p=>grid.innerHTML+=card(p));
}

(async()=>{
 await getTargets();
 await load();
})();

</script>
</body>
</html>
