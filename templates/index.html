<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Каталог</title>

  <style>
    :root{
      --bg:#fbfbfd;
      --card:#ffffff;
      --border:#ececf2;
      --text:#111;
      --muted:#6b6f76;
      --radius:22px;
      --gap:12px;
      --shadow: 0 10px 26px rgba(10,10,20,.06);
    }
    *{ box-sizing:border-box; }
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial;
      background:var(--bg);
      color:var(--text);
    }

    header{
      position:sticky; top:0; z-index:50;
      background: rgba(251,251,253,.92);
      backdrop-filter: blur(10px);
      border-bottom:1px solid var(--border);
      padding: 12px 12px 10px;
    }
    .row{ display:flex; gap:10px; align-items:center; }
    .row + .row{ margin-top:10px; }
    input{
      flex:1;
      padding: 13px 14px;
      border:1px solid var(--border);
      border-radius:16px;
      font-size:16px;
      outline:none;
      background:#fff;
    }
    button{
      padding: 13px 14px;
      border:1px solid var(--border);
      border-radius:16px;
      font-size:16px;
      background:#f2f3f7;
      cursor:pointer;
      white-space:nowrap;
    }
    .hint{
      margin-top:10px;
      color:var(--muted);
      font-size:14px;
      padding-left:2px;
    }

    main{ padding:12px; }
    .grid{
      display:grid;
      grid-template-columns: repeat(2, minmax(0,1fr));
      gap: var(--gap);
    }
    @media (min-width: 900px){
      .grid{ grid-template-columns: repeat(4, minmax(0,1fr)); }
    }

    .card{
      background:var(--card);
      border:1px solid var(--border);
      border-radius: var(--radius);
      overflow:hidden;
      box-shadow: var(--shadow);
    }

    .imgwrap{
      width:100%;
      aspect-ratio: 3/4;
      background:#f1f2f6;
      display:flex;
      align-items:center;
      justify-content:center;
      position:relative;
      cursor:pointer;
    }
    .imgwrap img{
      width:100%;
      height:100%;
      object-fit: cover;
      display:block;
      transform: translateZ(0);
    }
    .imgbadge{
      position:absolute;
      right:10px; top:10px;
      background: rgba(0,0,0,.55);
      color:#fff;
      padding:6px 10px;
      border-radius: 999px;
      font-weight:700;
      font-size:13px;
      backdrop-filter: blur(6px);
    }
    .imgfallback{ color:#9aa0a6; font-size:14px; }

    .meta{ padding: 12px 12px 14px; }
    .brand{
      font-weight: 900;
      letter-spacing:.3px;
      text-transform: uppercase;
      font-size: 18px;
      line-height:1.1;
    }
    .price{
      margin-top:8px;
      font-weight: 900;
      font-size: 24px;
      line-height:1.05;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;          /* чтобы не ломало цену */
      overflow: hidden;
      text-overflow: ellipsis;      /* если супер-длинно */
    }
    .cap{
      margin-top:8px;
      color: var(--text);
      font-size: 15px;
      line-height:1.25;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .actions{
      margin-top: 12px;
      display:flex;
      gap:10px;
    }
    .btn{
      flex:1;
      display:flex;
      align-items:center;
      justify-content:center;
      padding: 12px 10px;
      border-radius: 18px;
      font-weight: 900;
      font-size: 15px;
      text-decoration:none;
      user-select:none;
      line-height:1.1;
      text-align:center;
      min-height: 46px;             /* чтобы текст НЕ вылезал */
      white-space: normal;          /* разрешаем перенос */
    }
    .btn-tg{ background:#111; color:#fff; border:1px solid #111; }
    .btn-wa{ background:#fff; color:#111; border:2px solid #111; }

    .more{
      margin: 14px 0 30px;
      display:flex;
      justify-content:center;
    }
    .more button{
      background:#fff;
      font-weight:800;
    }

    /* ===== LUXURY VIEWER (modal) ===== */
    .viewer{
      position:fixed; inset:0;
      background: rgba(0,0,0,.86);
      display:none;
      z-index:999;
      padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom) 0;
    }
    .viewer.on{ display:block; }

    .viewer-top{
      position:absolute; top: env(safe-area-inset-top);
      left:0; right:0;
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding: 10px 12px;
      pointer-events:none;
    }
    .viewer-btn{
      pointer-events:auto;
      border:0;
      background: rgba(255,255,255,.12);
      color:#fff;
      padding: 10px 12px;
      border-radius: 14px;
      font-weight: 900;
    }
    .viewer-count{
      pointer-events:auto;
      background: rgba(255,255,255,.12);
      color:#fff;
      padding: 10px 12px;
      border-radius: 14px;
      font-weight: 900;
    }

    .stage{
      position:absolute; inset:0;
      display:flex;
      align-items:center;
      justify-content:center;
      padding: 60px 14px 110px;
    }

    .stage img{
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      border-radius: 10px;
      background:#111;
    }

    .nav{
      position:absolute; top:50%;
      transform: translateY(-50%);
      width: 46px; height: 46px;
      border-radius: 999px;
      border:0;
      background: rgba(255,255,255,.14);
      color:#fff;
      font-size: 26px;
      font-weight:900;
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
    }
    .nav.left{ left:10px; }
    .nav.right{ right:10px; }

    .thumbs{
      position:absolute; left:0; right:0; bottom: env(safe-area-inset-bottom);
      padding: 10px 10px 14px;
      display:flex;
      gap:10px;
      overflow:auto;
      -webkit-overflow-scrolling: touch;
    }
    .thumb{
      width: 62px; height: 62px;
      border-radius: 14px;
      overflow:hidden;
      border:2px solid rgba(255,255,255,.16);
      flex:0 0 auto;
      background: rgba(255,255,255,.08);
      cursor:pointer;
    }
    .thumb img{
      width:100%; height:100%;
      object-fit: cover;
      display:block;
    }
    .thumb.on{
      border-color: rgba(255,255,255,.95);
    }
  </style>
</head>

<body>
  <header>
    <div class="row">
      <input id="q" placeholder="Поиск (текст/описание)" />
    </div>
    <div class="row">
      <input id="brand" placeholder="Бренд (например dior)" />
