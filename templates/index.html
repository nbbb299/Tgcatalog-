<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Каталог</title>
  <style>
    :root{
      --gap:12px; --radius:18px; --border:#ececf2; --shadow: 0 10px 30px rgba(10,10,20,.06);
      --bg:#fafafb; --text:#111; --muted:#666;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;background:var(--bg);color:var(--text)}
    header{position:sticky;top:0;background:rgba(250,250,251,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);z-index:10}
    .row{display:flex;gap:10px;padding:12px;align-items:center}
    .row input{flex:1;padding:12px 14px;border:1px solid var(--border);border-radius:14px;font-size:16px;outline:none;background:#fff}
    .row button{padding:12px 14px;border:1px solid var(--border);border-radius:14px;font-size:16px;background:#f2f3f7;cursor:pointer}
    .hint{padding:0 12px 12px;color:var(--muted);font-size:14px}

    main{padding:12px}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--gap)}
    @media (min-width:900px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}

    .card{
      background:#fff;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);
      display:flex;flex-direction:column;
    }
    .imgwrap{
      width:100%;aspect-ratio:3/4;background:#f1f2f6;display:flex;align-items:center;justify-content:center;
      position:relative; cursor:pointer;
    }
    .imgwrap img{width:100%;height:100%;object-fit:cover;display:block}
    .imgfallback{color:#999;font-size:14px}

    .meta{padding:12px}
    .brand{font-weight:900;letter-spacing:.2px;font-size:18px;text-transform:uppercase}
    .price{margin-top:6px;font-weight:900;font-size:24px;line-height:1.1;word-break:break-word}
    .cap{margin-top:8px;white-space:pre-wrap;word-break:break-word;font-size:15px;line-height:1.25;color:#111}

    .actions{display:flex;gap:10px;margin-top:12px}
    .btn{
      flex:1;display:flex;align-items:center;justify-content:center;
      padding:12px 10px;border-radius:16px;font-weight:900;font-size:14px;text-decoration:none;user-select:none;
      min-width:0;
    }
    .btn span{
      display:block; text-align:center; line-height:1.05;
      white-space:normal; /* чтобы текст не обрезался */
    }
    .btn-tg{background:#111;color:#fff;border:1px solid #111}
    .btn-wa{background:#fff;color:#111;border:2px solid #111}

    .more{margin:14px 0 30px;display:flex;justify-content:center}
    .more button{padding:12px 16px;border:1px solid var(--border);border-radius:14px;background:#fff;font-weight:800;cursor:pointer}

    /* ---------- LUXURY VIEWER ---------- */
    .viewer{
      position:fixed; inset:0; background:rgba(0,0,0,.92);
      display:none; z-index:9999;
    }
    .viewer.open{display:block}
    .viewerTop{
      position:absolute; top:10px; left:10px; right:10px;
      display:flex; align-items:center; justify-content:space-between; gap:10px;
      pointer-events:none;
    }
    .vbtn{
      pointer-events:auto;
      width:44px;height:44px;border-radius:14px;border:1px solid rgba(255,255,255,.18);
      background:rgba(255,255,255,.08); color:#fff; font-size:22px; display:flex;align-items:center;justify-content:center;
    }
    .vcounter{
      pointer-events:auto;
      padding:10px 12px;border-radius:14px;border:1px solid rgba(255,255,255,.18);
      background:rgba(255,255,255,.08); color:#fff; font-weight:900;
    }
    .stage{
      position:absolute; inset:0;
      display:flex; align-items:center; justify-content:center;
      padding:64px 14px 120px;
    }
    .stageImg{
      max-width:min(92vw, 760px);
      max-height:72vh;
      width:auto; height:auto;
      border-radius:18px;
      background:#111;
      box-shadow: 0 18px 60px rgba(0,0,0,.45);
    }
    .nav{
      position:absolute; top:0; bottom:0; width:20%;
      display:flex; align-items:center; justify-content:center;
      color:#fff; font-size:44px; user-select:none;
      opacity:.65;
    }
    .nav:hover{opacity:1}
    .nav.left{left:0}
    .nav.right{right:0}
    .thumbs{
      position:absolute; left:0; right:0; bottom:18px;
      display:flex; gap:10px; justify-content:center; align-items:center;
      padding:0 14px;
      overflow:auto;
      -webkit-overflow-scrolling:touch;
    }
    .thumb{
      width:54px;height:54px;border-radius:14px;overflow:hidden;border:2px solid rgba(255,255,255,.18);
      flex:0 0 auto; opacity:.75; cursor:pointer;
    }
    .thumb.active{border-color:#fff; opacity:1}
    .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  </style>
</head>

<body>
<header>
  <div class="row">
    <input id="q" placeholder="Поиск (текст/описание)" />
  </div>
  <div class="row" style="padding-top:0">
    <input id="brand" placeholder="Бренд (например dior)" />
    <button onclick="resetAndLoad()">Найти</button>
  </div>
  <div class="hint">Совет: бренд можно вводить как “dior” без #</div>
</header>

<main>
  <div class="grid" id="grid"></div>
  <div class="more">
    <button id="moreBtn" onclick="loadMore()">Показать ещё</button>
  </div>
</main>

<!-- Viewer -->
<div class="viewer" id="viewer">
  <div class="viewerTop">
    <div class="vbtn" onclick="closeViewer()">×</div>
    <div class="vcounter" id="vcounter">1/1</div>
  </div>

  <div class="stage" id="stage">
    <div class="nav left" onclick="prevImg()">‹</div>
    <img class="stageImg" id="stageImg" alt="">
    <div class="nav right" onclick="nextImg()">›</div>
  </div>

  <div class="thumbs" id="thumbs"></div>
</div>

<script>
  let offset = 0;
  const limit = 30;
  let buyTelegram = "";
  let buyWhatsapp = "393463203783";
  let loading = false;

  // viewer state
  let V = { open:false, imgs:[], idx:0 };

  async function getBuyTarget(){
    try{
      const r = await fetch("/api/buy_target");
      const j = await r.json();
      buyTelegram = (j.telegram || "").trim();
      buyWhatsapp = (j.whatsapp || buyWhatsapp).trim();
    }catch(e){}
  }

  function escapeHtml(str){
    return (str || "")
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#39;");
  }

  function buildTelegramLink(p){
    const text = `Здравствуйте! Хочу заказать:\n\n${p.brand || ""}\n${p.price_raw || ""}\n${p.caption ? ("\n" + p.caption) : ""}`;
    const encoded = encodeURIComponent(text);
    if (buyTelegram) return `https://t.me/${buyTelegram}?text=${encoded}`;
    return `https://t.me/share/url?url=&text=${encoded}`;
  }

  function buildWhatsappLink(p){
    const text = `Здравствуйте! Хочу заказать:\n\n${p.brand || ""}\n${p.price_raw || ""}\n${p.caption ? ("\n" + p.caption) : ""}`;
    const encoded = encodeURIComponent(text);
    return `https://wa.me/${buyWhatsapp}?text=${encoded}`;
  }

  function imgSrc(file_id){
    return `/img/${encodeURIComponent(file_id)}`;
  }

  function imgBlock(p){
    const ids = (p.file_ids && p.file_ids.length) ? p.file_ids : (p.file_id ? [p.file_id] : []);
    if (!ids.length){
      return `<div class="imgwrap"><div class="imgfallback">Фото</div></div>`;
    }
    const first = ids[0];
    return `
      <div class="imgwrap" onclick='openViewer(${JSON.stringify(ids)})'>
        <img src="${imgSrc(first)}" alt="" loading="lazy"
             onerror="this.outerHTML='<div class=&quot;imgfallback&quot;>Фото</div>'" />
      </div>`;
  }

  function card(p){
    const b = (p.brand || "ITEM").toUpperCase();
    const tg = buildTelegramLink(p);
    const wa = buildWhatsappLink(p);

    const price = p.price_raw || "";
    const cap = p.caption ? `<div class="cap">${escapeHtml(p.caption)}</div>` : "";

    return `
      <div class="card">
        ${imgBlock(p)}
        <div class="meta">
          <div class="brand">${escapeHtml(b)}</div>
          <div class="price">${escapeHtml(price)}</div>
          ${cap}
          <div class="actions">
            <a class="btn btn-tg" href="${tg}" target="_blank" rel="noopener"><span>Купить в<br>Telegram</span></a>
            <a class="btn btn-wa" href="${wa}" target="_blank" rel="noopener"><span>Купить в<br>WhatsApp</span></a>
          </div>
        </div>
      </div>
    `;
  }

  async function fetchProducts(){
    const q = document.getElementById("q").value.trim();
    const brand = document.getElementById("brand").value.trim();

    const url = new URL(location.origin + "/api/products");
    url.searchParams.set("limit", String(limit));
    url.searchParams.set("offset", String(offset));
    if (q) url.searchParams.set("q", q);
    if (brand) url.searchParams.set("brand", brand);

    const r = await fetch(url.toString());
    if (!r.ok) throw new Error("API error");
    return await r.json();
  }

  async function loadMore(){
    if (loading) return;
    loading = true;

    const btn = document.getElementById("moreBtn");
    btn.disabled = true;
    btn.textContent = "Загружаю…";

    try{
      const data = await fetchProducts();
      const grid = document.getElementById("grid");

      data.forEach(p => grid.insertAdjacentHTML("beforeend", card(p)));
      offset += data.length;

      if (data.length < limit) btn.style.display = "none";
      else btn.style.display = "inline-block";
    }catch(e){
      alert("Не удалось загрузить товары. Проверь /api/products и логи Render.");
    }finally{
      btn.disabled = false;
      btn.textContent = "Показать ещё";
      loading = false;
    }
  }

  async function resetAndLoad(){
    offset = 0;
    document.getElementById("grid").innerHTML = "";
    document.getElementById("moreBtn").style.display = "inline-block";
    await loadMore();
  }

  // -------- Viewer --------
  function openViewer(ids){
    V.open = true;
    V.imgs = ids || [];
    V.idx = 0;
    document.getElementById("viewer").classList.add("open");
    renderViewer();
  }
  function closeViewer(){
    V.open = false;
    document.getElementById("viewer").classList.remove("open");
    document.getElementById("thumbs").innerHTML = "";
  }
  function renderViewer(){
    const total = V.imgs.length || 1;
    const idx = Math.max(0, Math.min(V.idx, total-1));
    V.idx = idx;

    document.getElementById("vcounter").textContent = `${idx+1}/${total}`;
    const img = document.getElementById("stageImg");
    img.src = imgSrc(V.imgs[idx]);

    const thumbs = document.getElementById("thumbs");
    thumbs.innerHTML = "";
    V.imgs.forEach((fid, i) => {
      const div = document.createElement("div");
      div.className = "thumb" + (i===idx ? " active" : "");
      div.onclick = () => { V.idx = i; renderViewer(); };
      div.innerHTML = `<img src="${imgSrc(fid)}" alt="">`;
      thumbs.appendChild(div);
    });
  }
  function nextImg(){ if(!V.open) return; if(V.idx < V.imgs.length-1){ V.idx++; renderViewer(); } }
  function prevImg(){ if(!V.open) return; if(V.idx > 0){ V.idx--; renderViewer(); } }

  // swipe
  (function(){
    const stage = document.getElementById("stage");
    let x0 = null;
    stage.addEventListener("touchstart", e => { x0 = e.touches[0].clientX; }, {passive:true});
    stage.addEventListener("touchend", e => {
      if(x0===null) return;
      const x1 = e.changedTouches[0].clientX;
      const dx = x1 - x0;
      x0 = null;
      if(Math.abs(dx) < 40) return;
      if(dx < 0) nextImg(); else prevImg();
    }, {passive:true});
    document.getElementById("viewer").addEventListener("click", (e) => {
      if(e.target.id === "viewer") closeViewer();
    });
  })();

  (async () => {
    await getBuyTarget();
    await resetAndLoad();
  })();
</script>
</body>
</html>
