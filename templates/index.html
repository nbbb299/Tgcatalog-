<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Каталог</title>

  <style>
    :root{
      --gap: 12px;
      --radius: 18px;
      --border: #e9e9ef;
      --bg: #fafafb;
      --card: #fff;
      --text: #111;
      --muted: #666;
    }

    *{ box-sizing: border-box; }
    body{
      margin:0;
      font-family: system-ui,-apple-system,Segoe UI,Roboto,Arial;
      background: var(--bg);
      color: var(--text);
    }

    header{
      position: sticky;
      top: 0;
      background: rgba(250,250,251,.92);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
      z-index: 10;
    }

    .row{
      display:flex;
      gap:10px;
      padding: 12px;
      align-items:center;
    }

    .row input{
      flex: 1;
      min-width: 0;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 14px;
      font-size: 16px;
      outline: none;
      background:#fff;
    }

    .row button{
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 14px;
      font-size: 16px;
      background:#f2f3f7;
      cursor: pointer;
      white-space: nowrap;
    }

    .hint{
      padding: 0 12px 12px;
      color: var(--muted);
      font-size: 14px;
    }

    main{ padding: 12px; }

    .grid{
      display:grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: var(--gap);
    }

    @media (min-width: 900px){
      .grid{ grid-template-columns: repeat(4, minmax(0, 1fr)); }
    }

    .card{
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow:hidden;
      box-shadow: 0 6px 22px rgba(15,15,25,.05);
      display:flex;
      flex-direction: column;
      min-width: 0;
    }

    .imgwrap{
      width:100%;
      aspect-ratio: 3 / 4;
      background:#f1f2f6;
      display:flex;
      align-items:center;
      justify-content:center;
      position: relative;
      overflow:hidden;
      cursor: pointer;
    }

    .imgwrap img{
      width:100%;
      height:100%;
      object-fit: cover;
      display:block;
    }

    .imgfallback{
      color:#999;
      font-size: 14px;
    }

    .meta{
      padding: 12px;
      display:flex;
      flex-direction: column;
      gap: 8px;
      min-width: 0;
    }

    .brand{
      font-weight: 900;
      letter-spacing: .2px;
      font-size: 18px;
      text-transform: uppercase;
      line-height: 1.15;
      word-break: break-word;
    }

    .price{
      font-weight: 900;
      font-size: 20px;
      line-height: 1.15;
      word-break: break-word;
    }

    .sizes{
      font-size: 15px;
      color: var(--text);
      line-height: 1.25;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .actions{
      display:flex;
      gap:10px;
      margin-top: 6px;
      width: 100%;
    }

    .btn{
      flex: 1;
      display:flex;
      align-items:center;
      justify-content:center;
      padding: 11px 10px;
      border-radius: 16px;
      font-weight: 800;
      font-size: 13px;
      text-decoration: none;
      user-select:none;
      min-width: 0;
      white-space: normal;
      text-align: center;
      line-height: 1.15;
    }

    .btn-tg{
      background:#111;
      color:#fff;
      border: 1px solid #111;
    }

    .btn-wa{
      background:#fff;
      color:#111;
      border: 2px solid #111;
    }

    @media (max-width: 380px){
      .actions{ flex-direction: column; }
      .btn{ width: 100%; }
    }

    .more{
      margin: 14px 0 30px;
      display:flex;
      justify-content:center;
    }

    .more button{
      padding: 12px 16px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background:#fff;
      font-weight: 700;
      cursor:pointer;
    }

    .empty{
      color: var(--muted);
      text-align:center;
      padding: 18px 0 8px;
      font-size: 14px;
    }

    /* =========================
       LUXURY VIEWER (Farfetch-like)
       ========================= */
    .lv{
      position:fixed; inset:0;
      background: rgba(0,0,0,.92);
      display:none;
      z-index:99999;
      overscroll-behavior: contain;
    }
    .lv.show{ display:block; }

    .lvTop{
      position:fixed; left:0; right:0; top:0;
      height:56px;
      display:flex; align-items:center; justify-content:space-between;
      padding:10px 12px;
      z-index: 3;
    }
    .lvBtn{
      width:42px; height:42px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,.22);
      background: rgba(255,255,255,.10);
      color:#fff; font-size:20px; font-weight:800;
      cursor:pointer;
    }
    .lvCounter{
      color:#fff;
      font-weight:800;
      letter-spacing:.3px;
      padding:8px 12px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,.18);
      background: rgba(255,255,255,.10);
    }

    .lvStage{
      position:absolute; inset:56px 0 94px 0;
      display:flex; align-items:center; justify-content:center;
      touch-action: none; /* pinch/drag */
    }
    .lvImg{
      max-width: 92vw;
      max-height: calc(100vh - 160px);
      object-fit: contain;
      user-select:none;
      transform: translate3d(0,0,0) scale(1);
      transition: transform .16s ease;
      will-change: transform;
    }

    .lvNav{
      position:fixed;
      top:50%;
      transform: translateY(-50%);
      width:48px; height:72px;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,.20);
      background: rgba(255,255,255,.10);
      color:#fff;
      font-size:44px;
      line-height: 1;
      cursor:pointer;
      z-index:3;
    }
    .lvPrev{ left:10px; }
    .lvNext{ right:10px; }
    @media (max-width: 520px){
      .lvNav{ width:44px; height:64px; font-size:40px; }
    }

    .lvThumbs{
      position:fixed; left:0; right:0; bottom:0;
      height:94px;
      display:flex;
      gap:10px;
      padding: 10px 12px 12px;
      overflow-x:auto;
      align-items:center;
      background: linear-gradient(to top, rgba(0,0,0,.65), rgba(0,0,0,0));
      z-index:3;
    }
    .lvT{
      width:64px; height:64px;
      border-radius: 14px;
      border: 2px solid rgba(255,255,255,.18);
      overflow:hidden;
      flex: 0 0 auto;
      cursor:pointer;
      opacity:.85;
    }
    .lvT.active{
      border-color: rgba(255,255,255,.85);
      opacity: 1;
    }
    .lvT img{ width:100%; height:100%; object-fit: cover; display:block; }
  </style>
</head>

<body>
  <header>
    <div class="row">
      <input id="q" placeholder="Поиск (текст/описание)" />
    </div>
    <div class="row" style="padding-top:0">
      <input id="brand" placeholder="Бренд (например dior)" />
      <button onclick="resetAndLoad()">Найти</button>
    </div>
    <div class="hint">Совет: бренд можно вводить как “dior” без #</div>
  </header>

  <main>
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty" style="display:none;">Ничего не найдено</div>

    <div class="more">
      <button id="moreBtn" onclick="loadMore()">Показать ещё</button>
    </div>
  </main>

  <!-- LUXURY VIEWER -->
  <div id="lv" class="lv" aria-hidden="true">
    <div class="lvTop">
      <button class="lvBtn" id="lvClose">✕</button>
      <div class="lvCounter" id="lvCounter">1 / 1</div>
    </div>

    <button class="lvNav lvPrev" id="lvPrev">‹</button>
    <button class="lvNav lvNext" id="lvNext">›</button>

    <div class="lvStage" id="lvStage">
      <img id="lvImg" class="lvImg" draggable="false" />
    </div>

    <div class="lvThumbs" id="lvThumbs"></div>
  </div>

  <script>
    let offset = 0;
    const limit = 30;
    let buyTelegram = "";
    let buyWhatsapp = "393463203783";
    let loading = false;

    function esc(s){
      return (s || "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#39;");
    }

    async function getBuyTarget(){
      try{
        const r = await fetch("/api/buy_target");
        const j = await r.json();
        buyTelegram = (j.telegram || "").trim().replace(/^@/, "");
        buyWhatsapp = (j.whatsapp || buyWhatsapp).trim().replace("+","");
      }catch(e){}
    }

    function getImages(p){
      if (Array.isArray(p.file_ids) && p.file_ids.length) return p.file_ids;
      if (p.file_id) return [p.file_id];
      return [];
    }

    function buildTelegramLink(p){
      const brand = (p.brand || "—").trim();
      const price = (p.price_raw || "").trim();
      const sizes = (p.caption || "").trim();
      const imgs = getImages(p);
      const img = imgs.length ? `${location.origin}/img/${encodeURIComponent(imgs[0])}` : "";

      let text = `Здравствуйте! Хочу заказать:\n\n${brand}`;
      if (price) text += `\n${price}`;
      if (sizes) text += `\n${sizes}`;
      if (img) text += `\n\nФото: ${img}`;

      const encoded = encodeURIComponent(text.slice(0, 3500));
      if (buyTelegram){
        return `https://t.me/${buyTelegram}?text=${encoded}`;
      }
      return `https://t.me/share/url?url=&text=${encoded}`;
    }

    function buildWhatsappLink(p){
      const brand = (p.brand || "—").trim();
      const price = (p.price_raw || "").trim();
      const sizes = (p.caption || "").trim();
      const imgs = getImages(p);
      const img = imgs.length ? `${location.origin}/img/${encodeURIComponent(imgs[0])}` : "";

      let text = `Здравствуйте! Хочу заказать:\n\n${brand}`;
      if (price) text += `\n${price}`;
      if (sizes) text += `\n${sizes}`;
      if (img) text += `\n\nФото: ${img}`;

      const encoded = encodeURIComponent(text.slice(0, 3500));
      return `https://wa.me/${buyWhatsapp}?text=${encoded}`;
    }

    function imgBlock(p){
      const imgs = getImages(p);
      if (!imgs.length){
        return `<div class="imgwrap"><div class="imgfallback">Фото</div></div>`;
      }
      const src = `/img/${encodeURIComponent(imgs[0])}`;
      const safe = encodeURIComponent(JSON.stringify(imgs));
      return `
        <div class="imgwrap" onclick="openViewerFromAttr(this)" data-imgs="${safe}">
          <img src="${src}" alt="" loading="lazy"
               onerror="this.outerHTML='<div class=&quot;imgwrap&quot;><div class=&quot;imgfallback&quot;>Фото</div></div>'" />
        </div>`;
    }

    function card(p){
      const brand = ((p.brand || "—") + "").toUpperCase();
      const price = (p.price_raw || "").trim();
      const sizes = (p.caption || "").trim();

      const tg = buildTelegramLink(p);
      const wa = buildWhatsappLink(p);

      return `
        <div class="card">
          ${imgBlock(p)}
          <div class="meta">
            <div class="brand">${esc(brand)}</div>
            ${price ? `<div class="price">${esc(price)}</div>` : ""}
            ${sizes ? `<div class="sizes">${esc(sizes)}</div>` : ""}
            <div class="actions">
              <a class="btn btn-tg" href="${tg}" target="_blank" rel="noopener">Купить в Telegram</a>
              <a class="btn btn-wa" href="${wa}" target="_blank" rel="noopener">Купить в WhatsApp</a>
            </div>
          </div>
        </div>
      `;
    }

    async function fetchProducts(){
      const q = document.getElementById("q").value.trim();
      const brand = document.getElementById("brand").value.trim();

      const url = new URL(location.origin + "/api/products");
      url.searchParams.set("limit", String(limit));
      url.searchParams.set("offset", String(offset));
      if (q) url.searchParams.set("q", q);
      if (brand) url.searchParams.set("brand", brand.replace(/^#/, ""));

      const r = await fetch(url.toString());
      if (!r.ok) throw new Error("API error");
      return await r.json();
    }

    async function loadMore(){
      if (loading) return;
      loading = true;

      const btn = document.getElementById("moreBtn");
      const empty = document.getElementById("empty");
      btn.disabled = true;
      btn.textContent = "Загружаю…";

      try{
        const data = await fetchProducts();
        const grid = document.getElementById("grid");

        data.forEach(p => grid.insertAdjacentHTML("beforeend", card(p)));
        offset += data.length;

        if (offset === data.length && data.length === 0){
          empty.style.display = "block";
          btn.style.display = "none";
        } else {
          empty.style.display = "none";
          if (data.length < limit) btn.style.display = "none";
          else btn.style.display = "inline-block";
        }

      }catch(e){
        alert("Не удалось загрузить товары. Проверь /api/products");
      }finally{
        btn.disabled = false;
        btn.textContent = "Показать ещё";
        loading = false;
      }
    }

    async function resetAndLoad(){
      offset = 0;
      document.getElementById("grid").innerHTML = "";
      document.getElementById("moreBtn").style.display = "inline-block";
      document.getElementById("empty").style.display = "none";
      await loadMore();
    }

    document.addEventListener("keydown", (e) => {
      if (e.key === "Enter") resetAndLoad();
    });

    /* =========================
       LUXURY VIEWER JS
       ========================= */
    let LV = { imgs: [], i: 0, scale: 1, tx: 0, ty: 0 };

    const elLV = document.getElementById("lv");
    const elImg = document.getElementById("lvImg");
    const elCounter = document.getElementById("lvCounter");
    const elThumbs = document.getElementById("lvThumbs");
    const elStage = document.getElementById("lvStage");

    function preload(src){
      const im = new Image();
      im.src = src;
    }

    function setTransform(){
      elImg.style.transform = `translate3d(${LV.tx}px, ${LV.ty}px, 0) scale(${LV.scale})`;
    }

    function resetZoom(){
      LV.scale = 1; LV.tx = 0; LV.ty = 0;
      setTransform();
    }

    function showLV(){
      elLV.classList.add("show");
      elLV.setAttribute("aria-hidden", "false");
      document.body.style.overflow = "hidden";
    }

    function hideLV(){
      elLV.classList.remove("show");
      elLV.setAttribute("aria-hidden", "true");
      document.body.style.overflow = "";
    }

    function renderThumbs(){
      elThumbs.innerHTML = "";
      LV.imgs.forEach((id, idx) => {
        const src = "/img/" + encodeURIComponent(id);
        const div = document.createElement("div");
        div.className = "lvT" + (idx === LV.i ? " active" : "");
        div.innerHTML = `<img src="${src}" loading="lazy">`;
        div.onclick = () => go(idx);
        elThumbs.appendChild(div);
      });
    }

    function go(idx){
      if (!LV.imgs.length) return;
      LV.i = (idx + LV.imgs.length) % LV.imgs.length;
      const id = LV.imgs[LV.i];
      const src = "/img/" + encodeURIComponent(id);

      preload("/img/" + encodeURIComponent(LV.imgs[(LV.i+1)%LV.imgs.length]));
      preload("/img/" + encodeURIComponent(LV.imgs[(LV.i-1+LV.imgs.length)%LV.imgs.length]));

      elImg.src = src;
      elCounter.textContent = `${LV.i+1} / ${LV.imgs.length}`;
      resetZoom();

      [...elThumbs.children].forEach((c, k) => c.classList.toggle("active", k === LV.i));
      const active = elThumbs.children[LV.i];
      if (active) active.scrollIntoView({behavior:"smooth", inline:"center", block:"nearest"});
    }

    window.openViewerFromAttr = function(el){
      try{
        const safe = el.getAttribute("data-imgs") || "";
        const imgs = JSON.parse(decodeURIComponent(safe));
        if (Array.isArray(imgs) && imgs.length){
          LV.imgs = imgs;
          LV.i = 0;
          renderThumbs();
          showLV();
          go(0);
        }
      }catch(e){}
    }

    document.getElementById("lvClose").onclick = hideLV;
    document.getElementById("lvPrev").onclick = () => go(LV.i - 1);
    document.getElementById("lvNext").onclick = () => go(LV.i + 1);

    document.addEventListener("keydown", (e) => {
      if (!elLV.classList.contains("show")) return;
      if (e.key === "Escape") hideLV();
      if (e.key === "ArrowLeft") go(LV.i - 1);
      if (e.key === "ArrowRight") go(LV.i + 1);
    });

    // Swipe + Pinch zoom (pointer events)
    let pointers = new Map();
    let startDist = 0, startScale = 1;
    let startX = 0, startY = 0, startTX = 0, startTY = 0;
    let swipeStartX = 0, swipeStartY = 0, swipeTime = 0;

    elStage.addEventListener("pointerdown", (e) => {
      elStage.setPointerCapture(e.pointerId);
      pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});

      swipeStartX = e.clientX; swipeStartY = e.clientY; swipeTime = Date.now();
      startX = e.clientX; startY = e.clientY;
      startTX = LV.tx; startTY = LV.ty;

      if (pointers.size === 2){
        const pts = [...pointers.values()];
        startDist = Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y);
        startScale = LV.scale;
      }
    });

    elStage.addEventListener("pointermove", (e) => {
      if (!pointers.has(e.pointerId)) return;
      pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});

      if (pointers.size === 2){
        const pts = [...pointers.values()];
        const dist = Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y);
        const factor = dist / (startDist || dist);
        LV.scale = Math.min(4, Math.max(1, startScale * factor));
        setTransform();
        return;
      }

      if (LV.scale > 1.01){
        LV.tx = startTX + (e.clientX - startX);
        LV.ty = startTY + (e.clientY - startY);
        setTransform();
      }
    });

    elStage.addEventListener("pointerup", (e) => {
      pointers.delete(e.pointerId);

      if (LV.scale <= 1.01){
        const dx = e.clientX - swipeStartX;
        const dy = e.clientY - swipeStartY;
        const dt = Date.now() - swipeTime;

        if (dt < 500 && Math.abs(dx) > 60 && Math.abs(dy) < 60){
          if (dx < 0) go(LV.i + 1);
          else go(LV.i - 1);
        }
      }
    });

    elStage.addEventListener("pointercancel", (e) => pointers.delete(e.pointerId));

    // Double tap / click to zoom
    let lastTap = 0;
    elStage.addEventListener("click", () => {
      if (!elLV.classList.contains("show")) return;
      const now = Date.now();
      if (now - lastTap < 280){
        if (LV.scale > 1.01) resetZoom();
        else { LV.scale = 2; LV.tx = 0; LV.ty = 0; setTransform(); }
      }
      lastTap = now;
    });

    // Wheel zoom (desktop)
    elStage.addEventListener("wheel", (e) => {
      if (!elLV.classList.contains("show")) return;
      e.preventDefault();
      const delta = -Math.sign(e.deltaY) * 0.15;
      LV.scale = Math.min(4, Math.max(1, LV.scale + delta));
      if (LV.scale <= 1.01) resetZoom();
      setTransform();
    }, {passive:false});

    (async () => {
      await getBuyTarget();
      await resetAndLoad();
    })();
  </script>
</body>
</html>
