<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>TG Catalog</title>

<style>
body{margin:0;background:#f5f6fa;font-family:system-ui}

.top{
position:sticky;
top:0;
background:#f5f6fa;
padding:12px;
border-bottom:1px solid #eee;
z-index:5
}

input{
width:100%;
padding:14px;
border-radius:14px;
border:1px solid #ddd;
margin-bottom:8px;
font-size:16px
}

button{
padding:14px;
border-radius:14px;
border:0;
background:#e3e7f5;
font-weight:700
}

.grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:12px;
padding:12px
}

.card{
background:#fff;
border-radius:18px;
overflow:hidden;
display:flex;
flex-direction:column;
box-shadow:0 4px 12px rgba(0,0,0,.06)
}

.media{
aspect-ratio:1/1;
background:#eee;
position:relative
}

.media img{
width:100%;
height:100%;
object-fit:cover
}

.body{
padding:10px;
flex:1
}

.brand{
font-weight:900;
font-size:16px
}

.caption{
white-space:pre-wrap;
font-size:14px
}

.actions{
position:sticky;
bottom:0;
background:#fff;
display:grid;
grid-template-columns:1fr 1fr;
gap:8px;
padding:10px
}

.btn{
text-decoration:none;
text-align:center;
padding:12px;
border-radius:14px;
font-weight:800;
border:2px solid #111
}

.tg{background:#111;color:#fff}
.wa{background:#fff;color:#111}

.viewer{
position:fixed;
inset:0;
background:#000;
display:none;
z-index:999;
align-items:center;
justify-content:center;
touch-action:none
}

.viewer.open{display:flex}

.viewer img{
max-width:95vw;
max-height:85vh;
transform-origin:center;
}

.close{
position:absolute;
top:10px;
left:10px;
color:#fff;
font-size:32px;
cursor:pointer
}
</style>
</head>

<body>

<div class="top">
<input id="q" placeholder="Поиск (любой текст)">
<input id="brand" placeholder="Бренд">
<button onclick="render()">Найти</button>
</div>

<div id="grid" class="grid"></div>

<div id="viewer" class="viewer">
<div class="close" onclick="closeViewer()">✕</div>
<img id="vimg">
</div>

<script>

let products=[]
let viewerIndex=0
let viewerPhotos=[]
let scale=1

function cleanCaption(text){

if(!text) return ""

return text
.replace(/По вопросам\s*@mikab16.*$/gim,"")
.trim()

}

function imgUrl(id){
return "/api/tgfile/"+encodeURIComponent(id)
}

async function load(){

const r=await fetch("/api/products?"+Date.now())
products=await r.json()

render()

}

function render(){

const q=document.getElementById("q").value.toLowerCase()
const brand=document.getElementById("brand").value.toLowerCase()

const grid=document.getElementById("grid")
grid.innerHTML=""

products
.filter(p=>{

const text=(p.brand+" "+p.caption).toLowerCase()

if(brand && !text.includes(brand)) return false
if(q && !text.includes(q)) return false

return true

})
.forEach(p=>{

const card=document.createElement("div")
card.className="card"

const media=document.createElement("div")
media.className="media"

const img=document.createElement("img")

const photos=p.file_ids||[]

if(photos.length){

img.src=imgUrl(photos[0])

media.onclick=()=>openViewer(photos,0)

}

media.appendChild(img)

const body=document.createElement("div")
body.className="body"

const brandEl=document.createElement("div")
brandEl.className="brand"
brandEl.textContent=p.brand||""

const cap=document.createElement("div")
cap.className="caption"
cap.textContent=cleanCaption(p.caption)

body.appendChild(brandEl)
body.appendChild(cap)

const actions=document.createElement("div")
actions.className="actions"

actions.innerHTML=`
<a class="btn tg" href="https://t.me/mikab16" target="_blank">Купить в Telegram</a>
<a class="btn wa" href="https://wa.me/393463203783" target="_blank">Купить в WhatsApp</a>
`

card.appendChild(media)
card.appendChild(body)
card.appendChild(actions)

grid.appendChild(card)

})

}

function openViewer(list,index){

viewerPhotos=list
viewerIndex=index

const v=document.getElementById("viewer")
const img=document.getElementById("vimg")

img.src=imgUrl(list[index])
scale=1
img.style.transform="scale(1)"

v.classList.add("open")

}

function closeViewer(){
document.getElementById("viewer").classList.remove("open")
}

let startDist=null

document.getElementById("viewer").addEventListener("touchmove",(e)=>{

if(e.touches.length==2){

const dx=e.touches[0].clientX-e.touches[1].clientX
const dy=e.touches[0].clientY-e.touches[1].clientY
const dist=Math.sqrt(dx*dx+dy*dy)

if(startDist===null) startDist=dist

scale*=dist/startDist
startDist=dist

document.getElementById("vimg").style.transform="scale("+scale+")"

}

},{passive:false})

document.getElementById("viewer").addEventListener("touchend",()=>{
startDist=null
})

load()

// авто обновление каждые 10 сек
setInterval(load,10000)

</script>

</body>
</html>
