<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Каталог</title>

  <style>
    :root{
      --bg:#fafafb;
      --card:#fff;
      --text:#111;
      --muted:#6b6f7a;
      --border:#e9e9ef;
      --radius:18px;
      --gap:12px;
      --shadow: 0 8px 28px rgba(12,14,20,.08);
      --btnRadius: 18px;
    }
    *{ box-sizing:border-box; }
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial;
      background:var(--bg);
      color:var(--text);
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
    }
    header{
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(250,250,251,.92);
      backdrop-filter: blur(10px);
      border-bottom:1px solid var(--border);
      padding-bottom: 6px;
    }
    .row{
      display:flex;
      gap:10px;
      padding: 12px;
      align-items:center;
    }
    .row input{
      flex: 1;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 14px;
      font-size: 16px;
      outline: none;
      background:#fff;
    }
    .row button{
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 14px;
      font-size: 16px;
      background:#f2f3f7;
      cursor: pointer;
      white-space: nowrap;
    }
    .hint{
      padding: 0 12px 12px;
      color:var(--muted);
      font-size: 14px;
    }

    main{ padding: 12px; }
    .grid{
      display:grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: var(--gap);
    }
    @media (min-width: 900px){
      .grid{ grid-template-columns: repeat(4, minmax(0, 1fr)); }
    }

    .card{
      background:var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow:hidden;
      box-shadow: var(--shadow);
    }
    .imgwrap{
      width: 100%;
      aspect-ratio: 3 / 4;
      background:#f1f2f6;
      display:flex;
      align-items:center;
      justify-content:center;
      position:relative;
      cursor:pointer;
      user-select:none;
    }
    .imgwrap img{
      width:100%;
      height:100%;
      object-fit: cover;
      display:block;
      transform: translateZ(0);
    }
    .imgfallback{ color:#9aa0aa; font-size:14px; }

    .meta{ padding: 12px; }
    .brand{
      font-weight: 900;
      letter-spacing: .2px;
      font-size: 18px;
      text-transform: uppercase;
      line-height: 1.1;
    }
    .price{
      margin-top: 6px;
      font-weight: 900;
      font-size: 26px;
      line-height: 1.1;
      word-break: break-word;
    }
    .sizes{
      margin-top: 8px;
      color: var(--text);
      font-size: 15px;
      line-height: 1.25;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .actions{
      display:flex;
      gap:10px;
      margin-top: 12px;
    }
    .btn {
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  padding:12px;
  border-radius:16px;
  font-weight:800;
  font-size:14px;
  text-decoration:none;
  white-space:nowrap;
    }
    .btn-tg{ background:#111; color:#fff; border: 1px solid #111; }
    .btn-wa{ background:#fff; color:#111; border: 2px solid #111; }

    .more{ margin: 14px 0 30px; display:flex; justify-content:center; }
    .more button{
      padding: 12px 16px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background:#fff;
      font-weight: 700;
      cursor:pointer;
    }

    /* ---------- Luxury Viewer (fullscreen) ---------- */
    .viewer{
      position: fixed;
      inset: 0;
      background: rgba(10,12,16,.86);
      display:none;
      z-index: 9999;
    }
    .viewer.show{ display:block; }
    .viewer-top{
      position:absolute;
      left:0; right:0; top:0;
      padding: env(safe-area-inset-top) 14px 10px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      height: calc(env(safe-area-inset-top) + 56px);
    }
    .viewer-btn{
      width:44px; height:44px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,.16);
      background: rgba(20,22,28,.55);
      color:#fff;
      font-size: 22px;
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .viewer-count{
      padding: 10px 12px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,.16);
      background: rgba(20,22,28,.55);
      color:#fff;
      font-weight: 800;
      font-size: 14px;
    }

    .viewer-stage{
      position:absolute;
      inset: 0;
      display:flex;
      align-items:center;
      justify-content:center;
      padding: calc(env(safe-area-inset-top) + 70px) 12px calc(env(safe-area-inset-bottom) + 110px);
    }
    .viewer-img{
      max-width: min(980px, 94vw);
      max-height: min(78vh, 820px);
      width: auto;
      height: auto;
      border-radius: 18px;
      background:#fff;
      object-fit: contain;
      box-shadow: 0 24px 80px rgba(0,0,0,.45);
    }

    .viewer-nav{
      position:absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 48px; height: 76px;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(20,22,28,.35);
      color:#fff;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size: 28px;
      cursor:pointer;
      user-select:none;
    }
    .viewer-nav.left{ left: 12px; }
    .viewer-nav.right{ right: 12px; }

    .thumbs{
      position:absolute;
      left:0; right:0;
      bottom: 0;
      padding: 10px 12px calc(env(safe-area-inset-bottom) + 12px);
      display:flex;
      gap:10px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      justify-content: center;
    }
    .thumb{
      width: 54px; height: 54px;
      border-radius: 16px;
      border: 2px solid rgba(255,255,255,.18);
      background: rgba(255,255,255,.10);
      overflow:hidden;
      flex: 0 0 auto;
      cursor:pointer;
    }
    .thumb img{
      width:100%; height:100%;
      object-fit: cover;
      display:block;
    }
    .thumb.active{
      border-color: rgba(255,255,255,.85);
      transform: translateZ(0);
    }

    @media (max-width: 420px){
      .btn{ font-size: 13px; padding: 12px 10px; }
      .viewer-nav{ display:none; } /* mobile = swipe */
      .thumbs{ justify-content: flex-start; }
    }
  </style>
</head>

<body>
<header>
  <div class="row">
    <input id="q" placeholder="Поиск (текст/описание)" />
  </div>
  <div class="row" style="padding-top:0">
    <input id="brand" placeholder="Бренд (например dior)" />
    <button onclick="resetAndLoad()">Найти</button>
  </div>
  <div class="hint">Совет: бренд можно вводить как “dior” без #</div>
</header>

<main>
  <div class="grid" id="grid"></div>
  <div class="more">
    <button id="moreBtn" onclick="loadMore()">Показать ещё</button>
  </div>
</main>

<!-- Luxury Viewer -->
<div class="viewer" id="viewer" aria-hidden="true">
  <div class="viewer-top">
    <div class="viewer-btn" onclick="closeViewer()" aria-label="Close">×</div>
    <div class="viewer-count" id="viewerCount">1/1</div>
    <div style="width:44px;height:44px;"></div>
  </div>

  <div class="viewer-stage" id="viewerStage">
    <div class="viewer-nav left" onclick="prevImg()">‹</div>
    <img id="viewerImg" class="viewer-img" src="" alt="" />
    <div class="viewer-nav right" onclick="nextImg()">›</div>
  </div>

  <div class="thumbs" id="thumbs"></div>
</div>

<script>
  let offset = 0;
  const limit = 30;
  let buyTelegram = "";
  let buyWhatsapp = "393463203783";
  let loading = false;

  // viewer state
  let viewerOpen = false;
  let viewerList = [];
  let viewerIndex = 0;

  async function getBuyTarget(){
    try{
      const r = await fetch("/api/buy_target");
      const j = await r.json();
      buyTelegram = (j.telegram || "").trim();
      buyWhatsapp = (j.whatsapp || buyWhatsapp).trim();
    }catch(e){}
  }

  function escapeHtml(str){
    return (str || "")
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#39;");
  }

  function buildTelegramLink(p){
    const text =
`Здравствуйте! Хочу заказать:

${p.brand || ""}

${p.price_raw || ""}

${(p.caption || "").slice(0, 800)}`;
    const encoded = encodeURIComponent(text);

    if (buyTelegram){
      return `https://t.me/${buyTelegram}?text=${encoded}`;
    }
    return `https://t.me/share/url?url=&text=${encoded}`;
  }

  function buildWhatsappLink(p){
    const text =
`Здравствуйте! Хочу заказать:

${p.brand || ""}

${p.price_raw || ""}

${(p.caption || "").slice(0, 800)}`;
    const encoded = encodeURIComponent(text);
    return `https://wa.me/${buyWhatsapp}?text=${encoded}`;
  }

  function fileIdToUrl(fid){
    return `/img/${encodeURIComponent(fid)}`;
  }

  function openViewer(fileIds, startIndex=0){
    viewerList = (fileIds || []).filter(Boolean);
    if (!viewerList.length) return;

    viewerIndex = Math.max(0, Math.min(startIndex, viewerList.length-1));
    viewerOpen = true;

    document.getElementById("viewer").classList.add("show");
    document.getElementById("viewer").setAttribute("aria-hidden","false");
    renderViewer();
  }

  function closeViewer(){
    viewerOpen = false;
    document.getElementById("viewer").classList.remove("show");
    document.getElementById("viewer").setAttribute("aria-hidden","true");
  }

  function renderViewer(){
    const img = document.getElementById("viewerImg");
    const count = document.getElementById("viewerCount");
    const thumbs = document.getElementById("thumbs");

    const total = viewerList.length;
    count.textContent = `${viewerIndex+1}/${total}`;

    img.src = fileIdToUrl(viewerList[viewerIndex]);

    // thumbs
    thumbs.innerHTML = "";
    viewerList.forEach((fid, i) => {
      const div = document.createElement("div");
      div.className = "thumb" + (i===viewerIndex ? " active" : "");
      div.onclick = () => { viewerIndex = i; renderViewer(); };
      const im = document.createElement("img");
      im.src = fileIdToUrl(fid);
      im.loading = "lazy";
      div.appendChild(im);
      thumbs.appendChild(div);
    });

    // center active thumb (nice)
    const active = thumbs.querySelector(".thumb.active");
    if (active){
      const rect = active.getBoundingClientRect();
      const wrapRect = thumbs.getBoundingClientRect();
      const delta = (rect.left + rect.width/2) - (wrapRect.left + wrapRect.width/2);
      thumbs.scrollLeft += delta;
    }
  }

  function nextImg(){
    if (!viewerOpen) return;
    viewerIndex = (viewerIndex + 1) % viewerList.length;
    renderViewer();
  }
  function prevImg(){
    if (!viewerOpen) return;
    viewerIndex = (viewerIndex - 1 + viewerList.length) % viewerList.length;
    renderViewer();
  }

  // Swipe (mobile)
  (function(){
    let startX = 0, startY = 0, moved = false;

    const stage = document.getElementById("viewerStage");
    stage.addEventListener("touchstart", (e) => {
      if (!viewerOpen) return;
      const t = e.touches[0];
      startX = t.clientX; startY = t.clientY; moved=false;
    }, {passive:true});

    stage.addEventListener("touchmove", (e) => {
      if (!viewerOpen) return;
      moved = true;
    }, {passive:true});

    stage.addEventListener("touchend", (e) => {
      if (!viewerOpen) return;
      if (!moved) return;
      const t = e.changedTouches[0];
      const dx = t.clientX - startX;
      const dy = t.clientY - startY;
      if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 40){
        if (dx < 0) nextImg(); else prevImg();
      }
    }, {passive:true});
  })();

  // Close by ESC / tap outside
  document.addEventListener("keydown", (e) => {
    if (!viewerOpen) return;
    if (e.key === "Escape") closeViewer();
    if (e.key === "ArrowRight") nextImg();
    if (e.key === "ArrowLeft") prevImg();
  });
  document.getElementById("viewer").addEventListener("click", (e) => {
    if (e.target.id === "viewer") closeViewer();
  });

  async function fetchProducts(){
    const q = document.getElementById("q").value.trim();
    const brand = document.getElementById("brand").value.trim();

    const url = new URL(location.origin + "/api/products");
    url.searchParams.set("limit", String(limit));
    url.searchParams.set("offset", String(offset));
    if (q) url.searchParams.set("q", q);
    if (brand) url.searchParams.set("brand", brand);

    const r = await fetch(url.toString());
    if (!r.ok) throw new Error("API error");
    return await r.json();
  }

  function card(p){
    const b = (p.brand || "ITEM").toUpperCase();
    const price = p.price_raw || "";
    const sizes = p.caption || "";

    const tg = buildTelegramLink(p);
    const wa = buildWhatsappLink(p);

    const fileIds = (p.file_ids || []).filter(Boolean);
    const first = fileIds[0];

    const imgHtml = first
      ? `<img src="${fileIdToUrl(first)}" alt="" loading="lazy" />`
      : `<div class="imgfallback">Фото</div>`;

    const imgClick = first ? `onclick='openViewer(${escapeHtml(JSON.stringify(fileIds))},0)'` : "";

    return `
      <div class="card">
        <div class="imgwrap" ${imgClick}>
          ${imgHtml}
        </div>

        <div class="meta">
          <div class="brand">${escapeHtml(b)}</div>
          <div class="price">${escapeHtml(price)}</div>
          ${sizes ? `<div class="sizes">${escapeHtml(sizes)}</div>` : ""}

          <div class="actions">
            <a class="btn btn-tg" href="${tg}" target="_blank" rel="noopener">Купить в Telegram</a>
            <a class="btn btn-wa" href="${wa}" target="_blank" rel="noopener">Купить в WhatsApp</a>
          </div>
        </div>
      </div>
    `;
  }

  async function loadMore(){
    if (loading) return;
    loading = true;

    const btn = document.getElementById("moreBtn");
    btn.disabled = true;
    btn.textContent = "Загружаю…";

    try{
      const data = await fetchProducts();
      const grid = document.getElementById("grid");
      data.forEach(p => grid.insertAdjacentHTML("beforeend", card(p)));
      offset += data.length;

      if (data.length < limit) btn.style.display = "none";
      else btn.style.display = "inline-block";
    }catch(e){
      alert("Не удалось загрузить товары. Проверь /api/products");
    }finally{
      btn.disabled = false;
      btn.textContent = "Показать ещё";
      loading = false;
    }
  }

  async function resetAndLoad(){
    offset = 0;
    document.getElementById("grid").innerHTML = "";
    document.getElementById("moreBtn").style.display = "inline-block";
    await loadMore();
  }

  (async () => {
    await getBuyTarget();
    await resetAndLoad();
  })();
</script>
</body>
</html>
