<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Каталог</title>

  <style>
    :root { --gap: 12px; --radius: 18px; --border: #e9e9ef; }
    body { margin:0; font-family: system-ui,-apple-system,Segoe UI,Roboto,Arial; background:#fafafb; color:#111; }
    header { position: sticky; top: 0; background: rgba(250,250,251,.92); backdrop-filter: blur(8px); border-bottom: 1px solid var(--border); z-index: 10; }
    .row { display:flex; gap:10px; padding: 12px; align-items:center; }
    .row input { flex: 1; padding: 12px 14px; border: 1px solid var(--border); border-radius: 14px; font-size: 16px; outline: none; background:#fff; }
    .row button { padding: 12px 14px; border: 1px solid var(--border); border-radius: 14px; font-size: 16px; background:#f2f3f7; cursor: pointer; }
    .hint { padding: 0 12px 12px; color:#666; font-size: 14px; }

    main { padding: 12px; }
    .grid { display:grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--gap); }
    @media (min-width: 900px){ .grid{ grid-template-columns: repeat(4, minmax(0, 1fr)); } }

    .card { background:#fff; border: 1px solid var(--border); border-radius: var(--radius); overflow:hidden; box-shadow: 0 6px 22px rgba(15,15,25,.05); }
    .imgwrap { width: 100%; aspect-ratio: 3 / 4; background:#f1f2f6; display:flex; align-items:center; justify-content:center; }
    .imgwrap img { width:100%; height:100%; object-fit: cover; display:block; }
    .imgfallback { color:#999; font-size: 14px; }

    .meta { padding: 12px; }
    .brand { font-weight: 900; letter-spacing: .2px; font-size: 18px; text-transform: uppercase; }
    .price { margin-top: 6px; font-weight: 900; font-size: 28px; line-height: 1.05; }
    .raw { margin-top: 4px; color:#666; font-size: 13px; }
    .cap { margin-top: 10px; white-space: pre-wrap; word-break: break-word; font-size: 15px; line-height: 1.25; }

    .actions { display:flex; gap:10px; margin-top: 12px; }
    .btn { flex: 1; display:flex; align-items:center; justify-content:center; gap:8px; padding: 12px; border-radius: 16px; font-weight: 800; font-size: 15px; text-decoration: none; user-select:none; }
    .btn-tg { background:#111; color:#fff; border: 1px solid #111; }
    .btn-wa { background:#fff; color:#111; border: 2px solid #111; }

    .more { margin: 14px 0 30px; display:flex; justify-content:center; }
    .more button { padding: 12px 16px; border: 1px solid var(--border); border-radius: 14px; background:#fff; font-weight: 700; cursor:pointer; }
  </style>
</head>

<body>
  <header>
    <div class="row">
      <input id="q" placeholder="Поиск (текст/описание)" />
    </div>
    <div class="row" style="padding-top:0">
      <input id="brand" placeholder="Бренд (например balmain)" />
      <button onclick="resetAndLoad()">Найти</button>
    </div>
    <div class="hint">Совет: бренд можно вводить как “dior” без #</div>
  </header>

  <main>
    <div class="grid" id="grid"></div>
    <div class="more">
      <button id="moreBtn" onclick="loadMore()">Показать ещё</button>
    </div>
  </main>

  <script>
    let offset = 0;
    const limit = 30;
    let buyTelegram = "";
    let buyWhatsapp = "393463203783"; // твой номер (как ты просила)
    let loading = false;

    async function getBuyTarget(){
      try{
        const r = await fetch("/api/buy_target");
        const j = await r.json();
        buyTelegram = (j.telegram || "").trim();
        buyWhatsapp = (j.whatsapp || buyWhatsapp).trim();
      }catch(e){}
    }

    function escapeHtml(str){
      return (str || "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#39;");
    }

    function formatEUR(v){
      if (v === null || v === undefined || v === "") return "";
      const num = Number(v);
      if (!Number.isFinite(num)) return "";
      try{
        return new Intl.NumberFormat("it-IT", { style:"currency", currency:"EUR", maximumFractionDigits: 2 }).format(num);
      }catch(e){
        return String(num);
      }
    }

    function buildTelegramLink(p){
      // Если указан username продавца — открываем чат t.me/<username>?text=...
      const text = `Здравствуйте! Хочу заказать:\n\n${p.brand || ""}\n${p.price_raw || ""}\n\n${(p.caption || "").slice(0, 800)}`;
      const encoded = encodeURIComponent(text);

      if (buyTelegram){
        return `https://t.me/${buyTelegram}?text=${encoded}`;
      }
      // запасной вариант: share
      return `https://t.me/share/url?url=&text=${encoded}`;
    }

    function buildWhatsappLink(p){
      const text = `Здравствуйте! Хочу заказать:\n\n${p.brand || ""}\n${p.price_raw || ""}\n\n${(p.caption || "").slice(0, 800)}`;
      const encoded = encodeURIComponent(text);
      // wa.me работает без плюса
      return `https://wa.me/${buyWhatsapp}?text=${encoded}`;
    }

    function imgBlock(p){
      if (!p.file_id){
        return `<div class="imgwrap"><div class="imgfallback">Фото</div></div>`;
      }
      // грузим через прокси /img/<file_id>
      const src = `/img/${encodeURIComponent(p.file_id)}`;
      return `
        <div class="imgwrap">
          <img src="${src}" alt="" loading="lazy"
               onerror="this.outerHTML='<div class=&quot;imgwrap&quot;><div class=&quot;imgfallback&quot;>Фото</div></div>'" />
        </div>`;
    }

    function card(p){
      const b = (p.brand || "item").toUpperCase();
      const priceBig = formatEUR(p.price_value) || (p.price_raw || "");
      const raw = p.price_raw ? `<div class="raw">${escapeHtml(p.price_raw)}</div>` : "";
      const cap = p.caption ? `<div class="cap">${escapeHtml(p.caption)}</div>` : "";

      const tg = buildTelegramLink(p);
      const wa = buildWhatsappLink(p);

      return `
        <div class="card">
          ${imgBlock(p)}
          <div class="meta">
            <div class="brand">${escapeHtml(b)}</div>
            <div class="price">${escapeHtml(priceBig)}</div>
            ${raw}
            ${cap}
            <div class="actions">
              <a class="btn btn-tg" href="${tg}" target="_blank" rel="noopener">Купить в Telegram</a>
              <a class="btn btn-wa" href="${wa}" target="_blank" rel="noopener">WhatsApp</a>
            </div>
          </div>
        </div>
      `;
    }

    async function fetchProducts(){
      const q = document.getElementById("q").value.trim();
      const brand = document.getElementById("brand").value.trim();

      const url = new URL(location.origin + "/api/products");
      url.searchParams.set("limit", String(limit));
      url.searchParams.set("offset", String(offset));
      if (q) url.searchParams.set("q", q);
      if (brand) url.searchParams.set("brand", brand);

      const r = await fetch(url.toString());
      if (!r.ok) throw new Error("API error");
      return await r.json();
    }

    async function loadMore(){
      if (loading) return;
      loading = true;

      const btn = document.getElementById("moreBtn");
      btn.disabled = true;
      btn.textContent = "Загружаю…";

      try{
        const data = await fetchProducts();
        const grid = document.getElementById("grid");

        data.forEach(p => grid.insertAdjacentHTML("beforeend", card(p)));
        offset += data.length;

        if (data.length < limit) btn.style.display = "none";
        else btn.style.display = "inline-block";
      }catch(e){
        alert("Не удалось загрузить товары. Проверь /api/products");
      }finally{
        btn.disabled = false;
        btn.textContent = "Показать ещё";
        loading = false;
      }
    }

    async function resetAndLoad(){
      offset = 0;
      document.getElementById("grid").innerHTML = "";
      document.getElementById("moreBtn").style.display = "inline-block";
      await loadMore();
    }

    (async () => {
      await getBuyTarget();
      await resetAndLoad();
    })();
  </script>
</body>
</html>
