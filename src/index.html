<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TG Catalog — Luxury</title>

  <style>
    :root{
      --bg:#f6f7fb;
      --card:#fff;
      --text:#0f172a;
      --muted:#6b7280;
      --stroke:#e6e8ee;
      --shadow:0 10px 30px rgba(0,0,0,.06);
      --r:22px;
      --btnR:18px;
      --black:#111;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial;
      color:var(--text);
      background:var(--bg);
    }

    /* Header */
    .top{
      position:sticky; top:0; z-index:10;
      background: rgba(246,247,251,.92);
      backdrop-filter: blur(10px);
      border-bottom:1px solid var(--stroke);
    }
    .wrap{max-width:1100px; margin:0 auto; padding:14px 14px;}
    .inputs{display:grid; gap:10px;}
    .row1{display:grid; grid-template-columns: 1fr; gap:10px;}
    .row2{display:grid; grid-template-columns: 1fr 110px; gap:10px;}
    input{
      width:100%;
      padding:14px 16px;
      border-radius:18px;
      border:1px solid var(--stroke);
      background:#fff;
      font-size:16px;
      outline:none;
    }
    input:focus{border-color:#cfd5e3; box-shadow:0 0 0 4px rgba(59,130,246,.12)}
    button{
      border:0;
      border-radius:18px;
      background:#e9eefc;
      color:#1f2a44;
      font-weight:800;
      font-size:16px;
      cursor:pointer;
    }
    button:active{transform: translateY(1px)}
    .hint{margin-top:6px; color:var(--muted); font-size:13px}

    /* Grid */
    .gridWrap{max-width:1100px; margin:0 auto; padding:14px;}
    .grid{
      display:grid;
      gap:14px;
      grid-template-columns: repeat(2, minmax(0,1fr));
    }
    @media (min-width: 900px){
      .grid{grid-template-columns: repeat(3, minmax(0,1fr));}
      .row2{grid-template-columns: 1fr 140px;}
    }

    /* Card */
    .card{
      background:var(--card);
      border:1px solid var(--stroke);
      border-radius: var(--r);
      box-shadow: var(--shadow);
      overflow:hidden;
      display:flex;
      flex-direction:column;
      min-height: 520px;
      position: relative;
    }

    .media{
      position:relative;
      background:#f0f2f7;
      width:100%;
      aspect-ratio: 1 / 1;
      overflow:hidden;
    }
    .media img{
      width:100%;
      height:100%;
      object-fit: cover;
      display:block;
      transform: translateZ(0);
    }

    .badge{
      position:absolute;
      right:10px; top:10px;
      background: rgba(17,17,17,.72);
      color:#fff;
      padding:6px 10px;
      border-radius:999px;
      font-size:12px;
      font-weight:800;
    }

    .body{
      padding:14px 14px 14px;
      display:flex;
      flex-direction:column;
      gap:10px;
      flex:1;
    }

    .titleRow{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:10px;
    }

    .brand{
      font-size:18px;
      font-weight:900;
      letter-spacing:.3px;
      text-transform: capitalize;
      line-height:1.1;
      margin-right:auto;
    }

    .price{
      font-weight:900;
      font-size:14px;
      background:#111;
      color:#fff;
      padding:8px 10px;
      border-radius:999px;
      white-space:nowrap;
      flex:0 0 auto;
    }

    .caption{
      color:#111;
      font-size:14px;
      line-height:1.35;
      white-space:pre-wrap;
      overflow:hidden;
      display:-webkit-box;
      -webkit-line-clamp: 6;
      -webkit-box-orient: vertical;
      min-height: 96px;
    }
    .caption.expanded{
      -webkit-line-clamp: unset;
      max-height:none;
    }

    .more{
      color:#111;
      font-weight:900;
      font-size:13px;
      cursor:pointer;
      user-select:none;
    }

    .actions{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap:10px;
      margin-top:auto;
      padding-top:6px;
    }

    .aBtn{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      padding:12px 10px;
      border-radius: var(--btnR);
      font-weight:900;
      text-decoration:none;
      font-size:14px;
      border:2px solid var(--black);
      white-space:nowrap;
      min-height:46px;
    }
    .aBtn.tg{background:var(--black); color:#fff;}
    .aBtn.wa{background:#fff; color:#111;}

    /* ✅ Mobile: fixed buy bar inside card */
    @media (max-width: 560px){
      .body{ padding-bottom: 84px; }
      .actions{
        position:absolute;
        left:14px;
        right:14px;
        bottom:14px;
        margin:0;
        padding:0;
        background: rgba(255,255,255,.96);
        backdrop-filter: blur(10px);
        border-radius: 20px;
        padding:10px;
        box-shadow: 0 10px 30px rgba(0,0,0,.08);
        border:1px solid rgba(230,232,238,.9);
      }
    }

    /* Skeleton */
    .skeleton{
      background: linear-gradient(90deg,#eef0f6 0%, #f6f7fb 40%, #eef0f6 80%);
      background-size: 200% 100%;
      animation: sk 1.2s infinite;
    }
    @keyframes sk{0%{background-position:0% 0}100%{background-position:-200% 0}}

    /* Viewer */
    .viewer{
      position:fixed;
      inset:0;
      background: rgba(0,0,0,.92);
      display:none;
      z-index:999;
      touch-action: none;
    }
    .viewer.open{display:block}

    .vTop{
      position:absolute;
      top:12px; left:12px; right:12px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      z-index:10;
    }
    .vClose, .vCount{
      background: rgba(255,255,255,.12);
      border:1px solid rgba(255,255,255,.18);
      color:#fff;
      border-radius: 14px;
      padding:10px 12px;
      font-weight:900;
      backdrop-filter: blur(8px);
      user-select:none;
      -webkit-user-select:none;
    }
    .vClose{
      cursor:pointer;
    }

    .vMain{
      position:absolute; inset:0;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:70px 16px 110px;
    }
    .vImgWrap{
      width:min(92vw, 920px);
      height:min(70vh, 920px);
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
      border-radius: 18px;
      background: rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.12);
      position:relative;
      touch-action: none;
    }
    .vImg{
      max-width:100%;
      max-height:100%;
      user-select:none;
      -webkit-user-drag:none;
      transform-origin:center center;
      transition: transform .06s linear;
      will-change: transform;
    }
    .vArrow{
      position:absolute;
      top:50%;
      transform: translateY(-50%);
      width:54px; height:54px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.2);
      background: rgba(255,255,255,.10);
      color:#fff;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:26px;
      font-weight:900;
      cursor:pointer;
      user-select:none;
      backdrop-filter: blur(8px);
      z-index:5;
    }
    .vArrow.left{left:14px}
    .vArrow.right{right:14px}
    .vArrow:active{transform: translateY(-50%) scale(.98)}

    .vThumbs{
      position:absolute;
      left:0; right:0; bottom:0;
      padding:14px 14px 18px;
      display:flex;
      gap:10px;
      overflow:auto;
      justify-content:center;
      z-index:6;
    }
    .thumb{
      width:54px; height:54px;
      border-radius:14px;
      overflow:hidden;
      border:2px solid rgba(255,255,255,.18);
      opacity:.7;
      cursor:pointer;
      flex:0 0 auto;
      background: rgba(255,255,255,.06);
    }
    .thumb.active{
      opacity:1;
      border-color:#fff;
    }
    .thumb img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }

    .empty{
      max-width:1100px;
      margin:20px auto;
      padding:0 14px;
      color:var(--muted);
      font-weight:800;
    }
    .err{
      color:#b91c1c;
      font-weight:900;
      margin-top:10px;
    }
  </style>
</head>

<body>
  <div class="top">
    <div class="wrap">
      <div class="inputs">
        <div class="row1">
          <input id="q" placeholder="Поиск (текст/описание)" autocomplete="off" />
        </div>
        <div class="row2">
          <input id="brand" placeholder="Бренд (например gucci)" autocomplete="off" />
          <button id="find">Найти</button>
        </div>
      </div>
      <div class="hint">Совет: бренд можно вводить как “gucci” без # (поиск идёт по бренду и по описанию)</div>
      <div id="status" class="err" style="display:none"></div>
    </div>
  </div>

  <div class="gridWrap">
    <div id="grid" class="grid"></div>
    <div id="empty" class="empty" style="display:none">Ничего не найдено.</div>
  </div>

  <!-- Viewer -->
  <div id="viewer" class="viewer" aria-hidden="true">
    <div class="vTop">
      <div id="vClose" class="vClose" role="button" aria-label="Close">✕</div>
      <div id="vCount" class="vCount">1/1</div>
    </div>

    <div class="vMain">
      <div class="vImgWrap" id="vImgWrap">
        <div class="vArrow left" id="vLeft">‹</div>
        <img id="vImg" class="vImg" alt="photo" />
        <div class="vArrow right" id="vRight">›</div>
      </div>
    </div>

    <div id="vThumbs" class="vThumbs"></div>
  </div>

  <script>
    const $ = (id)=>document.getElementById(id);

    function norm(s){
      return (s || "").toString().trim().toLowerCase();
    }

    function normBrand(s){
      return norm(s).replace(/^#/, "");
    }

    // "бренд" может быть пустым — поэтому показываем/ищем и по caption
    function isUselessBrand(b){
      const x = normBrand(b);
      return !x || x === "item" || x === "null" || x === "undefined" || x === "-" || x === "—";
    }

    // Достаём финальную цену (после "="), либо последнюю € сумму в строке
    function extractFinalPrice(text){
      if(!text) return "";
      const t = text.toString();

      // ищем строку с формулой скидки: "...%...=€..."
      const line = t.split("\n").map(x=>x.trim()).find(x=>{
        return x && /%/.test(x) && /=/.test(x) && ( /€/.test(x) || /â‚¬/.test(x) || /\d+€/.test(x) );
      });
      if(!line) return "";

      // Нормализуем кривой евро символ
      const s = line.replace(/â‚¬/g, "€");

      // 1) если есть "=...€...." — берём после "="
      const afterEq = s.split("=").pop().trim();
      if(afterEq){
        // вытащить первую € сумму
        const m = afterEq.match(/€\s*[\d\.\,]+/);
        if(m) return m[0].replace(/\s+/g,"");
      }

      // 2) иначе берём последнюю € сумму в строке
      const all = s.match(/€\s*[\d\.\,]+/g);
      if(all && all.length) return all[all.length-1].replace(/\s+/g,"");

      // 3) формат "1750€"
      const m2 = s.match(/[\d\.\,]+\s*€/g);
      if(m2 && m2.length) return m2[m2.length-1].replace(/\s+/g,"");

      return "";
    }

    // Чистим caption:
    // - убираем формулу скидки
    // - убираем "по вопросам @mikab16"
    function cleanCaption(text){
      if(!text) return "";
      const raw = text.toString().replace(/â‚¬/g, "€");
      const lines = raw.split("\n");

      const filtered = lines.filter(line=>{
        const s = line.trim();
        if(!s) return true;

        // ❌ убрать "по вопросам ..."
        if(/по вопросам/i.test(s)) return false;

        // ❌ убрать формулу скидки (оставляем цену отдельно badge)
        const hasPercent = /%/.test(s);
        const hasEq = /=/.test(s);
        const hasDash = /-/.test(s) || /—/.test(s);
        const hasEuro = /€/.test(s);

        const looksFormula = (hasPercent && hasEq && hasDash) || (hasEuro && hasPercent && (hasEq || hasDash));
        if(looksFormula) return false;

        return true;
      });

      return filtered.join("\n").trim();
    }

    // Candidates for image URLs (через backend proxy)
    function imgCandidates(fileIdOrUrl){
      if(!fileIdOrUrl) return [];
      const v = String(fileIdOrUrl);
      if(v.startsWith("http")) return [v];
      return [`/api/tgfile/${encodeURIComponent(v)}`];
    }

    function withCacheBuster(url){
      const sep = url.includes("?") ? "&" : "?";
      return url + sep + "cb=" + Date.now();
    }

    async function loadFirstWorkingImage(imgEl, fileIdOrUrl){
      const tries = imgCandidates(fileIdOrUrl);
      if(tries.length === 0){
        imgEl.classList.add("skeleton");
        imgEl.alt = "no image";
        return;
      }
      imgEl.classList.add("skeleton");

      for(const url0 of tries){
        const url = withCacheBuster(url0);
        const ok = await new Promise((resolve)=>{
          const t = new Image();
          t.onload = ()=>resolve(true);
          t.onerror = ()=>resolve(false);
          t.referrerPolicy = "no-referrer";
          t.src = url;
        });
        if(ok){
          imgEl.src = url;
          imgEl.classList.remove("skeleton");
          return;
        }
      }
      imgEl.removeAttribute("src");
      imgEl.classList.remove("skeleton");
      imgEl.alt = "image not available";
    }

    // Viewer state
    let viewerState = {
      photos: [],
      idx: 0,
      scale: 1,
      tx: 0,
      ty: 0,
      // gestures:
      pinching: false,
      dragging: false,
      startDist: 0,
      startScale: 1,
      startTx: 0,
      startTy: 0,
      dragStartX: 0,
      dragStartY: 0
    };

    function applyTransform(){
      $("vImg").style.transform = `translate(${viewerState.tx}px, ${viewerState.ty}px) scale(${viewerState.scale})`;
    }

    function openViewer(photos, startIdx=0){
      viewerState.photos = photos || [];
      viewerState.idx = Math.max(0, Math.min(startIdx, viewerState.photos.length-1));
      viewerState.scale = 1;
      viewerState.tx = 0;
      viewerState.ty = 0;
      $("viewer").classList.add("open");
      $("viewer").setAttribute("aria-hidden","false");
      renderViewer();
    }

    function closeViewer(){
      $("viewer").classList.remove("open");
      $("viewer").setAttribute("aria-hidden","true");
      // reset
      viewerState.scale = 1; viewerState.tx = 0; viewerState.ty = 0;
      applyTransform();
    }

    async function renderViewer(){
      const total = viewerState.photos.length || 1;
      const i = viewerState.idx;
      $("vCount").textContent = `${i+1}/${total}`;
      const fileIdOrUrl = viewerState.photos[i];
      applyTransform();
      await loadFirstWorkingImage($("vImg"), fileIdOrUrl);

      const thumbs = $("vThumbs");
      thumbs.innerHTML = "";
      viewerState.photos.forEach((pid, idx)=>{
        const d = document.createElement("div");
        d.className = "thumb" + (idx===i ? " active" : "");
        const im = document.createElement("img");
        d.appendChild(im);
        loadFirstWorkingImage(im, pid);
        d.onclick = ()=>{
          viewerState.idx = idx;
          viewerState.scale = 1; viewerState.tx = 0; viewerState.ty = 0;
          renderViewer();
        };
        thumbs.appendChild(d);
      });
    }

    function nextPhoto(delta){
      const n = viewerState.photos.length;
      if(n<=1) return;
      viewerState.idx = (viewerState.idx + delta + n) % n;
      viewerState.scale = 1; viewerState.tx = 0; viewerState.ty = 0;
      renderViewer();
    }

    // ✅ Pinch zoom + pan (touch)
    function dist(t1, t2){
      const dx = t2.clientX - t1.clientX;
      const dy = t2.clientY - t1.clientY;
      return Math.sqrt(dx*dx + dy*dy);
    }

    const wrap = $("vImgWrap");

    wrap.addEventListener("touchstart", (e)=>{
      if(!$("viewer").classList.contains("open")) return;

      if(e.touches.length === 2){
        viewerState.pinching = true;
        viewerState.dragging = false;
        viewerState.startDist = dist(e.touches[0], e.touches[1]);
        viewerState.startScale = viewerState.scale;
        viewerState.startTx = viewerState.tx;
        viewerState.startTy = viewerState.ty;
      }else if(e.touches.length === 1){
        viewerState.dragging = true;
        viewerState.pinching = false;
        viewerState.dragStartX = e.touches[0].clientX;
        viewerState.dragStartY = e.touches[0].clientY;
        viewerState.startTx = viewerState.tx;
        viewerState.startTy = viewerState.ty;
      }
    }, {passive:false});

    wrap.addEventListener("touchmove", (e)=>{
      if(!$("viewer").classList.contains("open")) return;
      e.preventDefault();

      if(viewerState.pinching && e.touches.length === 2){
        const d0 = viewerState.startDist || 1;
        const d1 = dist(e.touches[0], e.touches[1]);
        let next = viewerState.startScale * (d1 / d0);
        next = Math.max(1, Math.min(4, next));
        viewerState.scale = next;
        applyTransform();
      }else if(viewerState.dragging && e.touches.length === 1){
        if(viewerState.scale <= 1) return; // не таскаем если не увеличено
        const x = e.touches[0].clientX;
        const y = e.touches[0].clientY;
        viewerState.tx = viewerState.startTx + (x - viewerState.dragStartX);
        viewerState.ty = viewerState.startTy + (y - viewerState.dragStartY);
        applyTransform();
      }
    }, {passive:false});

    wrap.addEventListener("touchend", (e)=>{
      if(!$("viewer").classList.contains("open")) return;

      if(e.touches.length === 0){
        viewerState.pinching = false;
        viewerState.dragging = false;
        if(viewerState.scale <= 1){
          viewerState.tx = 0; viewerState.ty = 0;
          applyTransform();
        }
      }else if(e.touches.length === 1){
        viewerState.pinching = false;
        viewerState.dragging = true;
        viewerState.dragStartX = e.touches[0].clientX;
        viewerState.dragStartY = e.touches[0].clientY;
        viewerState.startTx = viewerState.tx;
        viewerState.startTy = viewerState.ty;
      }
    });

    // dbl tap toggle zoom
    let lastTap = 0;
    wrap.addEventListener("click", ()=>{
      if(!$("viewer").classList.contains("open")) return;
      const now = Date.now();
      if(now - lastTap < 280){
        viewerState.scale = (viewerState.scale === 1) ? 2 : 1;
        viewerState.tx = 0; viewerState.ty = 0;
        applyTransform();
      }
      lastTap = now;
    });

    // keyboard
    window.addEventListener("keydown", (e)=>{
      if(!$("viewer").classList.contains("open")) return;
      if(e.key === "Escape") closeViewer();
      if(e.key === "ArrowRight") nextPhoto(+1);
      if(e.key === "ArrowLeft") nextPhoto(-1);
    });

    // ✅ Close handlers (X + tap outside)
    $("vClose").addEventListener("click", closeViewer);
    $("vClose").addEventListener("touchend", (e)=>{ e.preventDefault(); closeViewer(); }, {passive:false});

    $("vLeft").onclick = ()=>nextPhoto(-1);
    $("vRight").onclick = ()=>nextPhoto(+1);

    $("viewer").addEventListener("click", (e)=>{
      if(e.target === $("viewer")) closeViewer();
    });

    // Buy links
    function buyLinks(){
      const tgUser = "mikab16";
      const wa = "393463203783";
      return {
        tg: `https://t.me/${encodeURIComponent(tgUser)}`,
        wa: `https://wa.me/${encodeURIComponent(wa)}`
      };
    }

    function bestBrandFromCaption(caption){
      // если brand пустой — попробуем взять первое слово (до пробела/эмодзи) из первой непустой строки
      if(!caption) return "";
      const first = caption.toString().split("\n").map(s=>s.trim()).find(Boolean);
      if(!first) return "";
      // часто бренд стоит первым словом
      return first.split(/\s+/)[0].replace(/^#/, "").trim();
    }

    function cardTemplate(p){
      const photos = (Array.isArray(p.file_ids) && p.file_ids.length)
        ? p.file_ids
        : (Array.isArray(p.images) && p.images.length ? p.images : (p.file_id ? [p.file_id] : []));

      const count = photos.length || 0;

      const rawCaption = (p.caption || "");
      const price = extractFinalPrice(rawCaption);
      const caption = cleanCaption(rawCaption);

      // бренд: берём из p.brand, если пусто — пытаемся из caption
      let brand = isUselessBrand(p.brand) ? "" : (p.brand || "").toString().trim();
      if(!brand){
        const guess = bestBrandFromCaption(rawCaption);
        if(guess && !isUselessBrand(guess)) brand = guess;
      }

      const {tg, wa} = buyLinks();

      const card = document.createElement("div");
      card.className = "card";

      const media = document.createElement("div");
      media.className = "media";

      const img = document.createElement("img");
      img.alt = brand || "Фото";
      media.appendChild(img);

      if(count > 1){
        const badge = document.createElement("div");
        badge.className = "badge";
        badge.textContent = `${count} фото`;
        media.appendChild(badge);
      }

      media.style.cursor = "pointer";
      media.onclick = ()=>{
        if(!photos.length) return;
        openViewer(photos, 0);
      };

      loadFirstWorkingImage(img, photos[0]);

      const body = document.createElement("div");
      body.className = "body";

      // title row
      if(brand || price){
        const row = document.createElement("div");
        row.className = "titleRow";

        if(brand){
          const b = document.createElement("div");
          b.className = "brand";
          b.textContent = brand;
          row.appendChild(b);
        }

        if(price){
          const pr = document.createElement("div");
          pr.className = "price";
          pr.textContent = price;
          row.appendChild(pr);
        }

        body.appendChild(row);
      }

      const cap = document.createElement("div");
      cap.className = "caption";
      cap.textContent = caption || "";
      body.appendChild(cap);

      if((caption || "").length > 160){
        const more = document.createElement("div");
        more.className = "more";
        more.textContent = "Показать полностью";
        more.onclick = ()=>{
          const exp = cap.classList.toggle("expanded");
          more.textContent = exp ? "Свернуть" : "Показать полностью";
        };
        body.appendChild(more);
      } else {
        const spacer = document.createElement("div");
        spacer.style.height = "18px";
        body.appendChild(spacer);
      }

      const actions = document.createElement("div");
      actions.className = "actions";

      const tgBtn = document.createElement("a");
      tgBtn.className = "aBtn tg";
      tgBtn.href = tg;
      tgBtn.target = "_blank";
      tgBtn.rel = "noopener";
      tgBtn.textContent = "Купить в Telegram";

      const waBtn = document.createElement("a");
      waBtn.className = "aBtn wa";
      waBtn.href = wa;
      waBtn.target = "_blank";
      waBtn.rel = "noopener";
      waBtn.textContent = "Купить в WhatsApp";

      actions.appendChild(tgBtn);
      actions.appendChild(waBtn);

      body.appendChild(actions);

      card.appendChild(media);
      card.appendChild(body);

      return card;
    }

    let allProducts = [];

    async function fetchProducts(){
      $("status").style.display="none";
      $("empty").style.display="none";

      const grid = $("grid");
      if(!allProducts.length){
        grid.innerHTML = "";
        for(let i=0;i<6;i++){
          const sk = document.createElement("div");
          sk.className = "card";
          sk.innerHTML = `
            <div class="media skeleton"></div>
            <div class="body">
              <div class="skeleton" style="height:22px;border-radius:12px"></div>
              <div class="skeleton" style="height:96px;border-radius:12px"></div>
              <div class="skeleton" style="height:46px;border-radius:18px;margin-top:auto"></div>
            </div>
          `;
          grid.appendChild(sk);
        }
      }

      try{
        const r = await fetch("/api/products", {cache:"no-store"});
        if(!r.ok) throw new Error("API /api/products вернул " + r.status);
        const data = await r.json();
        if(!Array.isArray(data)) throw new Error("API вернул не массив");
        allProducts = data;
        renderFiltered();
      }catch(e){
        grid.innerHTML = "";
        $("status").style.display="block";
        $("status").textContent = "Не удалось загрузить товары. Проверь /api/products и логи Render. " + e.message;
      }
    }

    function renderFiltered(){
      const q = norm($("q").value);
      const b = normBrand($("brand").value);

      let list = allProducts.slice();

      // newest first
      list.sort((a,c)=>{
        const ta = Number(a.ts || 0);
        const tc = Number(c.ts || 0);
        if(tc !== ta) return tc - ta;
        const ia = Number(a.id || 0), ic = Number(c.id || 0);
        return ic - ia;
      });

      // ✅ бренд-фильтр: ищем и по brand, и по caption, и по #brand
      if(b){
        list = list.filter(p=>{
          const brand = normBrand(p.brand || "");
          const cap = norm((p.caption || "").replace(/â‚¬/g,"€"));
          return brand.includes(b) || cap.includes(b) || cap.includes("#"+b);
        });
      }

      // ✅ общий поиск: по brand+caption
      if(q){
        list = list.filter(p=>{
          const hay = `${p.brand||""}\n${p.caption||""}`.toLowerCase();
          return hay.includes(q);
        });
      }

      const grid = $("grid");
      grid.innerHTML = "";

      if(!list.length){
        $("empty").style.display="block";
        return;
      }
      $("empty").style.display="none";

      list.forEach(p=>{
        grid.appendChild(cardTemplate(p));
      });
    }

    $("find").onclick = renderFiltered;
    $("q").addEventListener("keydown", (e)=>{ if(e.key==="Enter") renderFiltered(); });
    $("brand").addEventListener("keydown", (e)=>{ if(e.key==="Enter") renderFiltered(); });

    // ✅ авто-обновление, чтобы новые товары из Telegram появлялись сами
    fetchProducts();
    setInterval(fetchProducts, 20000);
    document.addEventListener("visibilitychange", ()=>{
      if(!document.hidden) fetchProducts();
    });
  </script>
</body>
</html>
