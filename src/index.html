<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TG Catalog — Luxury</title>

  <style>
    :root{
      --bg:#f6f7fb;
      --card:#fff;
      --text:#0f172a;
      --muted:#6b7280;
      --stroke:#e6e8ee;
      --shadow:0 10px 30px rgba(0,0,0,.06);
      --r:22px;
      --btnR:18px;
      --black:#111;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial;
      color:var(--text);
      background:var(--bg);
    }

    .top{
      position:sticky; top:0; z-index:10;
      background: rgba(246,247,251,.92);
      backdrop-filter: blur(10px);
      border-bottom:1px solid var(--stroke);
    }
    .wrap{max-width:1100px; margin:0 auto; padding:14px;}
    .inputs{display:grid; gap:10px;}
    .row1{display:grid; grid-template-columns: 1fr; gap:10px;}
    .row2{display:grid; grid-template-columns: 1fr 110px; gap:10px;}
    input{
      width:100%;
      padding:14px 16px;
      border-radius:18px;
      border:1px solid var(--stroke);
      background:#fff;
      font-size:16px;
      outline:none;
    }
    button{
      border:0;
      border-radius:18px;
      background:#e9eefc;
      color:#1f2a44;
      font-weight:800;
      font-size:16px;
      cursor:pointer;
    }
    .hint{margin-top:6px; color:var(--muted); font-size:13px}

    .gridWrap{max-width:1100px; margin:0 auto; padding:14px;}
    .grid{
      display:grid;
      gap:14px;
      grid-template-columns: repeat(2, minmax(0,1fr));
    }
    @media (min-width: 900px){
      .grid{grid-template-columns: repeat(3, minmax(0,1fr));}
      .row2{grid-template-columns: 1fr 140px;}
    }

    .card{
      background:var(--card);
      border:1px solid var(--stroke);
      border-radius: var(--r);
      box-shadow: var(--shadow);
      overflow:hidden;
      display:flex;
      flex-direction:column;
      min-height: 520px;
    }

    .media{
      position:relative;
      background:#f0f2f7;
      width:100%;
      aspect-ratio: 1 / 1;
      overflow:hidden;
      cursor:pointer;
    }
    .media img{
      width:100%;
      height:100%;
      object-fit: cover;
      display:block;
      transform: translateZ(0);
    }

    .badge{
      position:absolute;
      right:10px; top:10px;
      background: rgba(17,17,17,.72);
      color:#fff;
      padding:6px 10px;
      border-radius:999px;
      font-size:12px;
      font-weight:800;
    }

    .body{
      padding:14px;
      display:flex;
      flex-direction:column;
      gap:10px;
      flex:1;
    }

    .brand{
      font-size:18px;
      font-weight:900;
      letter-spacing:.3px;
      line-height:1.1;
    }

    /* держим место под кнопки — чтобы ВСЕГДА были видны */
    .caption{
      color:#111;
      font-size:14px;
      line-height:1.35;
      white-space:pre-wrap;
      overflow:hidden;
      display:-webkit-box;
      -webkit-line-clamp: 6;
      -webkit-box-orient: vertical;
      min-height: 96px;
    }
    .caption.expanded{
      -webkit-line-clamp: unset;
      max-height:none;
    }

    .more{
      color:#111;
      font-weight:900;
      font-size:13px;
      cursor:pointer;
      user-select:none;
    }

    /* Кнопки всегда видимы */
    .actions{
      margin-top:auto;
      display:grid;
      gap:10px;
      grid-template-columns: 1fr 1fr;
    }
    .aBtn{
      display:flex;
      align-items:center;
      justify-content:center;
      padding:12px 10px;
      border-radius: var(--btnR);
      font-weight:900;
      text-decoration:none;
      font-size:14px;
      border:2px solid var(--black);
      white-space:nowrap;
      min-height:46px;
      min-width:0;
    }
    .aBtn.tg{background:var(--black); color:#fff;}
    .aBtn.wa{background:#fff; color:#111;}

    /* ✅ МОБИЛКА: ставим кнопки В СТОЛБИК (100% видны, ничего не режется) */
    @media (max-width: 520px){
      .actions{ grid-template-columns: 1fr; }
      .card{ min-height: 500px; }
      .caption{ -webkit-line-clamp: 5; }
    }

    .skeleton{
      background: linear-gradient(90deg,#eef0f6 0%, #f6f7fb 40%, #eef0f6 80%);
      background-size: 200% 100%;
      animation: sk 1.2s infinite;
    }
    @keyframes sk{0%{background-position:0% 0}100%{background-position:-200% 0}}

    /* Viewer */
    .viewer{
      position:fixed;
      inset:0;
      background: rgba(0,0,0,.92);
      display:none;
      z-index:999;
      touch-action: pan-y;
    }
    .viewer.open{display:block}
    .vTop{
      position:absolute;
      top:12px; left:12px; right:12px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      z-index:10;
    }
    .vClose, .vCount{
      background: rgba(255,255,255,.12);
      border:1px solid rgba(255,255,255,.18);
      color:#fff;
      border-radius: 14px;
      padding:10px 12px;
      font-weight:900;
      backdrop-filter: blur(8px);
      user-select:none;
      -webkit-user-select:none;
    }
    .vClose{cursor:pointer}

    .vMain{
      position:absolute; inset:0;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:70px 16px 110px;
    }
    .vImgWrap{
      width:min(92vw, 920px);
      height:min(70vh, 920px);
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
      border-radius: 18px;
      background: rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.12);
      position:relative;
    }
    .vImg{
      max-width:100%;
      max-height:100%;
      user-select:none;
      -webkit-user-drag:none;
    }
    .vArrow{
      position:absolute;
      top:50%;
      transform: translateY(-50%);
      width:54px; height:54px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.2);
      background: rgba(255,255,255,.10);
      color:#fff;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:26px;
      font-weight:900;
      cursor:pointer;
      user-select:none;
      backdrop-filter: blur(8px);
    }
    .vArrow.left{left:14px}
    .vArrow.right{right:14px}

    .vThumbs{
      position:absolute;
      left:0; right:0; bottom:0;
      padding:14px 14px 18px;
      display:flex;
      gap:10px;
      overflow:auto;
      justify-content:center;
    }
    .thumb{
      width:54px; height:54px;
      border-radius:14px;
      overflow:hidden;
      border:2px solid rgba(255,255,255,.18);
      opacity:.7;
      cursor:pointer;
      flex:0 0 auto;
      background: rgba(255,255,255,.06);
    }
    .thumb.active{opacity:1;border-color:#fff;}
    .thumb img{width:100%;height:100%;object-fit:cover;display:block;}

    .empty{
      max-width:1100px;
      margin:20px auto;
      padding:0 14px;
      color:var(--muted);
      font-weight:800;
    }
    .err{color:#b91c1c;font-weight:900;margin-top:10px;}
  </style>
</head>

<body>
  <div class="top">
    <div class="wrap">
      <div class="inputs">
        <div class="row1">
          <input id="q" placeholder="Поиск (текст/описание)" autocomplete="off" />
        </div>
        <div class="row2">
          <input id="brand" placeholder="Бренд (например gucci)" autocomplete="off" />
          <button id="find">Найти</button>
        </div>
      </div>
      <div class="hint">Совет: можно искать по бренду и по любому тексту из описания.</div>
      <div id="status" class="err" style="display:none"></div>
    </div>
  </div>

  <div class="gridWrap">
    <div id="grid" class="grid"></div>
    <div id="empty" class="empty" style="display:none">Ничего не найдено.</div>
  </div>

  <!-- Viewer -->
  <div id="viewer" class="viewer" aria-hidden="true">
    <div class="vTop">
      <div id="vClose" class="vClose" role="button" aria-label="Close">✕</div>
      <div id="vCount" class="vCount">1/1</div>
    </div>

    <div class="vMain">
      <div class="vImgWrap" id="vImgWrap">
        <div class="vArrow left" id="vLeft">‹</div>
        <img id="vImg" class="vImg" alt="photo" />
        <div class="vArrow right" id="vRight">›</div>
      </div>
    </div>

    <div id="vThumbs" class="vThumbs"></div>
  </div>

  <script>
    const $ = (id)=>document.getElementById(id);

    function norm(s){
      return (s || "").toString().trim().toLowerCase();
    }
    function normBrand(s){
      return norm(s).replace(/^#/, "");
    }

    // ✅ Описание = как в Telegram, но УДАЛЯЕМ только строку "по вопросам @..."
    function cleanCaption(text){
      if(!text) return "";
      const raw = text.toString();
      const lines = raw.split("\n");
      const filtered = lines.filter(line=>{
        const s = line.trim();
        if(!s) return true;
        // убираем "по вопросам @mikab16" и любые "по вопросам @..."
        if(/по вопросам/i.test(s)) return false;
        if(/@mikab16/i.test(s)) return false;
        return true;
      });
      return filtered.join("\n").trim();
    }

    function imgUrl(fileIdOrUrl){
      if(!fileIdOrUrl) return "";
      const v = String(fileIdOrUrl);
      if(v.startsWith("http")) return v;
      return `/api/tgfile/${encodeURIComponent(v)}`;
    }

    // быстрый показ + предзагрузка
    function preload(url){
      if(!url) return;
      const im = new Image();
      im.decoding = "async";
      im.loading = "eager";
      im.src = url;
    }

    async function loadImage(imgEl, fileIdOrUrl){
      const url = imgUrl(fileIdOrUrl);
      if(!url){
        imgEl.classList.add("skeleton");
        imgEl.alt = "no image";
        return;
      }
      imgEl.classList.add("skeleton");
      imgEl.decoding = "async";
      imgEl.loading = "lazy";
      imgEl.src = url;
      imgEl.onload = ()=>imgEl.classList.remove("skeleton");
      imgEl.onerror = ()=>{ imgEl.classList.remove("skeleton"); imgEl.alt="image not available"; };
    }

    // Viewer state
    let viewerState = { photos: [], idx: 0 };

    function openViewer(photos, startIdx=0){
      viewerState.photos = photos || [];
      viewerState.idx = Math.max(0, Math.min(startIdx, viewerState.photos.length-1));
      $("viewer").classList.add("open");
      $("viewer").setAttribute("aria-hidden","false");
      renderViewer(true);
    }

    function closeViewer(){
      $("viewer").classList.remove("open");
      $("viewer").setAttribute("aria-hidden","true");
    }

    function renderViewer(preloadNeighbors=false){
      const total = viewerState.photos.length || 1;
      const i = viewerState.idx;
      $("vCount").textContent = `${i+1}/${total}`;

      const main = $("vImg");
      const url = imgUrl(viewerState.photos[i]);
      main.decoding = "async";
      main.loading = "eager";
      main.src = url;

      if(preloadNeighbors && total > 1){
        const prev = imgUrl(viewerState.photos[(i - 1 + total) % total]);
        const next = imgUrl(viewerState.photos[(i + 1) % total]);
        preload(prev); preload(next);
      }

      const thumbs = $("vThumbs");
      thumbs.innerHTML = "";
      viewerState.photos.forEach((pid, idx)=>{
        const d = document.createElement("div");
        d.className = "thumb" + (idx===i ? " active" : "");
        const im = document.createElement("img");
        d.appendChild(im);
        im.src = imgUrl(pid);
        d.onclick = ()=>{
          viewerState.idx = idx;
          renderViewer(true);
        };
        thumbs.appendChild(d);
      });
    }

    function nextPhoto(delta){
      const n = viewerState.photos.length;
      if(n<=1) return;
      viewerState.idx = (viewerState.idx + delta + n) % n;
      renderViewer(true);
    }

    // swipe left/right
    let touchStartX = null;
    $("vImgWrap").addEventListener("touchstart", (e)=>{
      if(!e.touches || !e.touches[0]) return;
      touchStartX = e.touches[0].clientX;
    }, {passive:true});

    $("vImgWrap").addEventListener("touchend", (e)=>{
      if(touchStartX === null) return;
      const endX = (e.changedTouches && e.changedTouches[0]) ? e.changedTouches[0].clientX : touchStartX;
      const dx = endX - touchStartX;
      touchStartX = null;
      if(Math.abs(dx) > 45){
        nextPhoto(dx < 0 ? +1 : -1);
      }
    }, {passive:true});

    $("vClose").addEventListener("click", closeViewer);
    $("vLeft").onclick = ()=>nextPhoto(-1);
    $("vRight").onclick = ()=>nextPhoto(+1);
    $("viewer").addEventListener("click", (e)=>{
      if(e.target === $("viewer")) closeViewer();
    });

    // Buy links
    function buyLinks(){
      const tgUser = "mikab16";
      const wa = "393463203783";
      return {
        tg: `https://t.me/${encodeURIComponent(tgUser)}`,
        wa: `https://wa.me/${encodeURIComponent(wa)}`
      };
    }

    function cardTemplate(p){
      const photos = (Array.isArray(p.file_ids) && p.file_ids.length) ? p.file_ids : (p.file_id ? [p.file_id] : []);
      const count = photos.length || 0;

      const brand = (p.brand || "").toString().trim();
      const caption = cleanCaption(p.caption || "");

      const {tg, wa} = buyLinks();

      const card = document.createElement("div");
      card.className = "card";

      const media = document.createElement("div");
      media.className = "media";

      const img = document.createElement("img");
      img.alt = brand || "Фото";
      media.appendChild(img);

      if(count > 1){
        const badge = document.createElement("div");
        badge.className = "badge";
        badge.textContent = `${count} фото`;
        media.appendChild(badge);
      }

      media.onclick = ()=>{
        if(!photos.length) return;
        openViewer(photos, 0);
      };

      loadImage(img, photos[0]);

      const body = document.createElement("div");
      body.className = "body";

      if(brand){
        const b = document.createElement("div");
        b.className = "brand";
        b.textContent = brand;
        body.appendChild(b);
      }

      const cap = document.createElement("div");
      cap.className = "caption";
      cap.textContent = caption;
      body.appendChild(cap);

      if(caption.length > 160){
        const more = document.createElement("div");
        more.className = "more";
        more.textContent = "Показать полностью";
        more.onclick = ()=>{
          const exp = cap.classList.toggle("expanded");
          more.textContent = exp ? "Свернуть" : "Показать полностью";
        };
        body.appendChild(more);
      } else {
        const spacer = document.createElement("div");
        spacer.style.height = "18px";
        body.appendChild(spacer);
      }

      const actions = document.createElement("div");
      actions.className = "actions";

      const tgBtn = document.createElement("a");
      tgBtn.className = "aBtn tg";
      tgBtn.href = tg;
      tgBtn.target = "_blank";
      tgBtn.rel = "noopener";
      tgBtn.textContent = "Купить в Telegram";

      const waBtn = document.createElement("a");
      waBtn.className = "aBtn wa";
      waBtn.href = wa;
      waBtn.target = "_blank";
      waBtn.rel = "noopener";
      waBtn.textContent = "Купить в WhatsApp";

      actions.appendChild(tgBtn);
      actions.appendChild(waBtn);

      body.appendChild(actions);

      card.appendChild(media);
      card.appendChild(body);
      return card;
    }

    let allProducts = [];

    async function fetchProducts(){
      $("status").style.display="none";
      $("empty").style.display="none";

      try{
        const r = await fetch("/api/products", {cache:"no-store"});
        if(!r.ok) throw new Error("API /api/products вернул " + r.status);
        const data = await r.json();
        if(!Array.isArray(data)) throw new Error("API вернул не массив");

        allProducts = data;
        renderFiltered();
      }catch(e){
        $("grid").innerHTML = "";
        $("status").style.display="block";
        $("status").textContent = "Не удалось загрузить товары. " + e.message;
      }
    }

    function renderFiltered(){
      const q = norm($("q").value);
      const b = normBrand($("brand").value);

      let list = allProducts.slice();

      if(b){
        list = list.filter(p=>{
          const hay = `${p.brand||""}\n${p.caption||""}`.toLowerCase();
          return hay.includes(b) || hay.includes("#"+b);
        });
      }
      if(q){
        list = list.filter(p=>{
          const hay = `${p.brand||""}\n${p.caption||""}`.toLowerCase();
          return hay.includes(q);
        });
      }

      const grid = $("grid");
      grid.innerHTML = "";

      if(!list.length){
        $("empty").style.display="block";
        return;
      }
      $("empty").style.display="none";

      list.forEach(p=> grid.appendChild(cardTemplate(p)));
    }

    $("find").onclick = renderFiltered;
    $("q").addEventListener("keydown", (e)=>{ if(e.key==="Enter") renderFiltered(); });
    $("brand").addEventListener("keydown", (e)=>{ if(e.key==="Enter") renderFiltered(); });

    fetchProducts();
    setInterval(fetchProducts, 20000);
    document.addEventListener("visibilitychange", ()=>{
      if(!document.hidden) fetchProducts();
    });
  </script>
</body>
</html>
