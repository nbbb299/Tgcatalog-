<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TG Catalog — Luxury</title>

<style>
:root{
--bg:#f6f7fb;
--card:#fff;
--text:#0f172a;
--muted:#6b7280;
--stroke:#e6e8ee;
--shadow:0 10px 30px rgba(0,0,0,.06);
--r:22px;
--btnR:18px;
--black:#111;
}
*{box-sizing:border-box}
body{
margin:0;
font-family: ui-sans-serif, system-ui;
background:var(--bg);
}

/* ===== DATE BADGE ADDED ===== */
.dateBadge{
position:absolute;
left:10px;
top:10px;
background: rgba(255,255,255,.92);
backdrop-filter: blur(6px);
border-radius:999px;
padding:6px 10px;
font-size:11px;
font-weight:900;
letter-spacing:.5px;
border:1px solid rgba(0,0,0,.06);
}

/* твои стили дальше 그대로 */
.badge{
position:absolute;
right:10px;
top:10px;
background: rgba(17,17,17,.72);
color:#fff;
padding:6px 10px;
border-radius:999px;
font-size:12px;
font-weight:800;
}

.media{
position:relative;
aspect-ratio:1/1;
overflow:hidden;
background:#f0f2f7;
}
.media img{
width:100%;
height:100%;
object-fit:cover;
}

.card{
background:#fff;
border-radius:22px;
overflow:hidden;
display:flex;
flex-direction:column;
}

.actions{
margin-top:auto;
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}

.aBtn{
display:flex;
align-items:center;
justify-content:center;
padding:10px;
border:2px solid #111;
border-radius:18px;
font-weight:900;
text-decoration:none;
white-space:normal;
text-align:center;
line-height:1.05;
}

.aBtn.tg{background:#111;color:#fff;}
.aBtn.wa{background:#fff;color:#111;}
</style>
</head>

<body>

<div id="grid"></div>

<script>

function imgUrl(v){
if(!v) return "";
if(v.startsWith("http")) return v;
return "/api/tgfile/"+encodeURIComponent(v);
}

function cardTemplate(p){

const photos = (Array.isArray(p.file_ids) && p.file_ids.length)
? p.file_ids
: (p.file_id ? [p.file_id] : []);

const card = document.createElement("div");
card.className="card";

const media=document.createElement("div");
media.className="media";

const img=document.createElement("img");
img.src=imgUrl(photos[0]);
media.appendChild(img);

/* ===== DATE BADGE ADDED HERE ===== */

if(p.ts){

const date=new Date(p.ts*1000);

const day=String(date.getDate()).padStart(2,"0");
const month=date.toLocaleString("en",{month:"short"}).toUpperCase();

const today=new Date();
const isToday=today.toDateString()===date.toDateString();

const dateBadge=document.createElement("div");
dateBadge.className="dateBadge";
dateBadge.textContent=(isToday?"NEW • ":"")+day+" "+month;

media.appendChild(dateBadge);
}

/* ===== existing photo count badge ===== */

if(photos.length>1){
const badge=document.createElement("div");
badge.className="badge";
badge.textContent=photos.length+" фото";
media.appendChild(badge);
}

card.appendChild(media);

const actions=document.createElement("div");
actions.className="actions";

const tg=document.createElement("a");
tg.className="aBtn tg";
tg.innerHTML="Купить<br>в Telegram";
tg.href="https://t.me/mikab16";

const wa=document.createElement("a");
wa.className="aBtn wa";
wa.innerHTML="Купить<br>в WhatsApp";
wa.href="https://wa.me/393463203783";

actions.appendChild(tg);
actions.appendChild(wa);

card.appendChild(actions);

return card;
}

/* demo load */

async function load(){

const r=await fetch("/api/products",{cache:"no-store"});
const data=await r.json();

const grid=document.getElementById("grid");
grid.innerHTML="";

data.forEach(p=>{
grid.appendChild(cardTemplate(p));
});

}

load();
setInterval(load,10000);

</script>
</body>
</html>
